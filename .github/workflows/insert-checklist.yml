name: ☑️ Generate and insert markdown from YAML

on:
  workflow_dispatch:
  push:
    branches: [ master ]
    paths:
      - 'personal-security-checklist.yml'
      - 'personal-security-checklist.en.yml'
      - 'personal-security-checklist.fa.yml'
    
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository 🛎️
        uses: actions/checkout@v2
        
      # Get current date-time (used for commit message)
      - name: Get Date 📅
        id: date
        run: echo "::set-output name=date::$(date +'%d-%b-%Y')"
        
      # Downloads + installs Python (used for running gen scripts)  
      - name: Set up Python 🐍
        uses: actions/setup-python@v2
        with:
          python-version: '3.x'
          
      # Install contents of requirements.txt
      - name: Install dependencies 📥
        run: |
          python -m pip install --upgrade pip
          cd lib && pip install -r requirements.txt

      # Generate Markdown from YAML
      - name: Generate checklist markdown 🔨
        run: |
          python lib/generate.py --input personal-security-checklist.en.yml --output CHECKLIST.md --locale en
          python lib/generate.py --input personal-security-checklist.fa.yml --output CHECKLIST.fa.md --locale fa

      # Commit and push the outputed JSON files
      - name: Commit and push generated files ⤴️
        run: |
          git config --global user.name "hamid-k"
          git config --global user.email "hamid-k@users.noreply.github.com"
          git pull origin master
          git add CHECKLIST.md CHECKLIST.fa.md
          if git diff --staged --quiet; then
            echo "Nothin new added, so nothing to commit, exiting..."
          else
            git commit -m "Updates checklist (auto-generated, on ${{ steps.date.outputs.date }})"
            git push
          fi
