name: Deploy GitHub Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: web/yarn.lock
      - name: Install dependencies
        working-directory: web
        run: yarn install --frozen-lockfile
      - name: Set Pages env
        run: |
          REPO_NAME="${{ github.event.repository.name }}"
          OWNER="${{ github.repository_owner }}"
          if [ "$REPO_NAME" = "${OWNER}.github.io" ]; then
            echo "PUBLIC_BASE_PATH=/" >> "$GITHUB_ENV"
            echo "PUBLIC_ORIGIN=https://${OWNER}.github.io" >> "$GITHUB_ENV"
            echo "PAGES_DIR=web/dist" >> "$GITHUB_ENV"
          else
            echo "PUBLIC_BASE_PATH=/$REPO_NAME/" >> "$GITHUB_ENV"
            echo "PUBLIC_ORIGIN=https://${OWNER}.github.io/$REPO_NAME" >> "$GITHUB_ENV"
            echo "PAGES_DIR=web/dist/$REPO_NAME" >> "$GITHUB_ENV"
          fi
      - name: Build site
        working-directory: web
        run: yarn build.static
      - name: Add SPA fallback
        run: |
          if [ -f "$PAGES_DIR/index.html" ]; then
            cp "$PAGES_DIR/index.html" "$PAGES_DIR/404.html"
          fi
      - name: Add .nojekyll
        run: touch "$PAGES_DIR/.nojekyll"
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.PAGES_DIR }}
          name: github-pages-${{ github.run_id }}

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}
