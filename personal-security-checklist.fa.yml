- title: شبکه‌ها
  slug: networks
  description: محافظت از ترافیک شبکه
  icon: network
  intro: >
    این بخش درباره اتصال امن دستگاه‌ها به اینترنت است، از جمله پیکربندی روتر و راه‌اندازی VPN.
  checklist:
  - point: استفاده از VPN
    priority: Essential
    details: >-
      از VPN معتبر و پولی استفاده کنید. این کار می‌تواند از ثبت IP واقعی شما توسط سایت‌ها جلوگیری کند،
      داده‌ای که ISP جمع می‌کند را کاهش دهد و حفاظت در وای‌فای عمومی را افزایش دهد.

  - point: گذرواژه روتر را تغییر دهید
    priority: Essential
    details: >-
      پس از خرید روتر جدید، گذرواژه را تغییر دهید. گذرواژه‌های پیش‌فرض عمومی هستند و هر کسی در نزدیکی می‌تواند وصل شود.

  - point: از WPA2 و گذرواژه قوی استفاده کنید
    priority: Essential
    details: >-
      برای اتصال به وای‌فای پروتکل‌های مختلفی وجود دارد. امن‌ترین گزینه‌ها در حال حاضر WPA2 و WPA3 (روی روترهای جدید) هستند.

  - point: فریم‌ور روتر را به‌روز نگه دارید
    priority: Essential
    details: >-
      تولیدکنندگان به‌روزرسانی فریم‌ور برای رفع آسیب‌پذیری‌ها، افزودن استانداردها و بهبود کارایی منتشر می‌کنند.

  - point: VPN سراسری شبکه پیاده‌سازی کنید
    priority: Optional
    details: >-
      اگر VPN را روی روتر، فایروال یا سرور خانگی تنظیم کنید، ترافیک همه دستگاه‌ها رمزنگاری و از آن عبور می‌کند،
      بدون نیاز به نصب جداگانه VPN روی هر دستگاه.

  - point: از نشت DNS جلوگیری کنید
    priority: Optional
    details: >-
      هنگام استفاده از VPN، حتما فقط از DNS ارائه‌دهنده VPN یا یک سرویس امن استفاده کنید.

  - point: از پروتکل امن VPN استفاده کنید
    priority: Optional
    details: >-
      OpenVPN و WireGuard پروتکل‌های تونل‌زنی متن‌باز، سبک و امن هستند. از PPTP یا SSTP استفاده نکنید.

  - point: DNS امن
    priority: Optional
    details: >-
      از DNS-over-HTTPS استفاده کنید که درخواست‌های DNS را از طریق HTTPS و به‌صورت رمزنگاری‌شده انجام می‌دهد.

  - point: از روتر رایگان ISP استفاده نکنید
    priority: Optional
    details: >-
      این روترها معمولا ارزان و انبوه ساخته می‌شوند و فریم‌ور اختصاصی ناامن دارند که به‌روزرسانی منظم دریافت نمی‌کند.

  - point: فهرست سفید آدرس‌های MAC
    priority: Optional
    details: >-
      می‌توانید در تنظیمات روتر آدرس‌های MAC را در فهرست سفید قرار دهید تا دستگاه‌های ناشناس حتی با داشتن رمز نتوانند وصل شوند.

  - point: تغییر آدرس IP محلی روتر
    priority: Optional
    details: >-
      ممکن است یک اسکریپت مخرب در مرورگر از آسیب‌پذیری XSS سوءاستفاده کرده و از طریق IP محلی به روترهای آسیب‌پذیر دسترسی پیدا کند.

  - point: اطلاعات شخصی را در SSID فاش نکنید
    priority: Optional
    details: >-
      نام شبکه را طوری انتخاب کنید که هویت شما، شماره واحد/آدرس یا برند/مدل دستگاه را نشان ندهد.

  - point: از فهرست‌های روتر خارج شوید
    priority: Optional
    details: >-
      SSIDهای وای‌فای اسکن و ثبت می‌شوند و روی سایت‌های مختلف منتشر می‌گردند که برای برخی یک نگرانی جدی حریم خصوصی است.

  - point: SSID را مخفی کنید
    priority: Optional
    details: >-
      SSID همان نام شبکه است. اگر قابل مشاهده نباشد، ممکن است سوءاستفاده کمتری رخ دهد.

  - point: غیرفعال کردن WPS
    priority: Optional
    details: >-
      WPS اتصال آسان‌تری بدون وارد کردن گذرواژه طولانی می‌دهد، اما مشکلات امنیتی جدی ایجاد می‌کند.

  - point: غیرفعال کردن UPnP
    priority: Optional
    details: >-
      UPnP به برنامه‌ها اجازه می‌دهد پورت‌ها را خودکار فوروارد کنند، اما سابقه طولانی مشکلات امنیتی دارد.

  - point: برای مهمان‌ها شبکه مهمان بسازید
    priority: Optional
    details: >-
      دسترسی به وای‌فای اصلی را به مهمان‌ها ندهید، چون می‌توانند با دیگر دستگاه‌ها تعامل داشته باشند.

  - point: تغییر IP پیش‌فرض روتر
    priority: Optional
    details: >-
      تغییر IP پیش‌فرض پنل مدیریت روتر کار اسکریپت‌های مخرب را سخت‌تر می‌کند.

  - point: فرایندها و سرویس‌های اضافی روتر را غیرفعال کنید
    priority: Optional
    details: >-
      سرویس‌هایی مثل Telnet و SSH نباید در اینترنت باز باشند و در شبکه محلی هم اگر لازم نیستند غیرفعال شوند.

  - point: پورت‌های باز نداشته باشید
    priority: Optional
    details: >-
      پورت‌های غیرضروری را ببندید؛ پورت‌های باز درگاه آسان برای هکرها هستند.

  - point: پروتکل‌های دسترسی از راه دور غیرضروری را غیرفعال کنید
    priority: Optional
    details: >-
      فعال بودن پروتکل‌هایی مثل PING، Telnet، SSH، UPnP و HNAP باعث می‌شود روتر از هرجای دنیا قابل بررسی باشد.

  - point: مدیریت ابری را غیرفعال کنید
    priority: Optional
    details: >-
      پنل مدیریت روتر بسیار حساس است؛ اگر مهاجم دسترسی بگیرد خسارت زیادی می‌تواند ایجاد کند.

  - point: برد شبکه را درست تنظیم کنید
    priority: Optional
    details: >-
      زیاد کردن برد روتر وسوسه‌انگیز است، اما اگر در خانه کوچک زندگی می‌کنید، دریافت سیگنال از بیرون سطح حمله را بالا می‌برد.

  - point: همه ترافیک را از [Tor](https://awesome-privacy.xyz/networking/mix-networks/tor) عبور دهید
    priority: Advanced
    details: >-
      VPNها هم ضعف دارند. برای امنیت بیشتر، همه ترافیک اینترنت را از شبکه [Tor](https://awesome-privacy.xyz/networking/mix-networks/tor) عبور دهید.

  - point: وای‌فای را روی همه دستگاه‌ها خاموش کنید
    priority: Advanced
    details: >-
      اتصال به حتی وای‌فای امن هم سطح حمله را افزایش می‌دهد. وای‌فای خانگی را خاموش کنید و دستگاه‌ها را با اترنت وصل کنید.
  color: violet
