      url: https://awesome-privacy.xyz#email-clients

- title: پیام‌رسانی
  slug: messaging
  description: خصوصی و امن نگه داشتن ارتباطات
  icon: messaging
  intro: >-
    پیام‌رسان‌ها بخش مهمی از ارتباطات روزمره هستند. انتخاب پلتفرم مناسب و رعایت تنظیمات امنیتی می‌تواند
    از افشای محتوا و فراداده جلوگیری کند.
  checklist:
  - point: فقط از پیام‌رسان‌های کاملا رمزنگاری سرتاسری استفاده کنید
    priority: Essential
    details: >-
      رمزنگاری سرتاسری یعنی پیام‌ها روی دستگاه شما رمز می‌شوند و فقط در دستگاه گیرنده باز می‌شوند. این کار
      باعث می‌شود هیچ فرد یا سرویسی که ترافیک را رهگیری می‌کند نتواند محتوای پیام‌ها را بخواند، حتی اگر به
      سرورهای مرکزی دسترسی داشته باشد.

  - point: فقط از پلتفرم‌های متن‌باز استفاده کنید
    priority: Essential
    details: >-
      متن‌باز بودن کد اجازه می‌دهد افراد متخصص آن را بررسی و ممیزی کنند تا از نبود درِ پشتی و آسیب‌پذیری‌ها مطمئن شوند.

  - point: از پلتفرم «قابل اعتماد» استفاده کنید
    priority: Essential
    details: >-
      هنگام انتخاب پیام‌رسان رمزنگاری‌شده، مطمئن شوید کاملا متن‌باز، پایدار، فعالانه نگه‌داری‌شده و ترجیحا توسط
      توسعه‌دهندگان معتبر پشتیبانی می‌شود.

  - point: تنظیمات امنیتی را بررسی کنید
    priority: Essential
    details: >-
      تنظیمات امنیتی مثل تایید مخاطب، اعلان‌های امنیتی و رمزنگاری را فعال کنید. قابلیت‌های غیرضروری مثل رسید خواندن،
      آخرین بازدید و اعلان تایپ را غیرفعال کنید.

  - point: از امن بودن محیط گیرنده مطمئن شوید
    priority: Essential
    details: >-
      امنیت گفت‌وگو به اندازه ضعیف‌ترین حلقه است. اغلب ساده‌ترین راه نفوذ، هدف گرفتن فرد یا گره با کمترین حفاظت است.

  - point: سرویس‌های ابری را غیرفعال کنید
    priority: Essential
    details: >-
      برخی پیام‌رسان‌ها نسخه وب یا دسکتاپ دارند که سطح حمله را افزایش می‌دهد و با مشکلات امنیتی جدی مرتبط بوده‌اند.
      اگر ممکن است از آن‌ها پرهیز کنید.

  - point: چت‌های گروهی را امن کنید
    priority: Essential
    details: >-
      با افزایش اعضای گروه، سطح حمله بیشتر و ریسک نفوذ چند برابر می‌شود. به‌صورت دوره‌ای مطمئن شوید همه اعضا معتبر هستند.

  - point: محیط امن برای ارتباط ایجاد کنید
    priority: Essential
    details: >-
      ارتباطات دیجیتال شما در چندین مرحله می‌تواند رصد یا رهگیری شود: دستگاه شما یا مخاطب، ارائه‌دهنده اینترنت،
      دروازه ملی یا ثبت دولتی، ارائه‌دهنده پیام‌رسان و سرورها.

  - point: درباره برنامه ارتباطی توافق کنید
    priority: Optional
    details: >-
      در برخی شرایط بهتر است برنامه ارتباطی داشته باشید که روش اصلی و پشتیبان ارتباط امن را مشخص کند.

  - point: فراداده را از رسانه‌ها حذف کنید
    priority: Optional
    details: >-
      فراداده یعنی «داده درباره داده». هنگام ارسال عکس، صوت، ویدئو یا سند ممکن است اطلاعات بیشتری از آنچه می‌خواهید
      افشا شود.

  - point: لینک‌ها را خنثی‌سازی کنید
    priority: Optional
    details: >-
      ارسال لینک از طریق سرویس‌ها می‌تواند ناخواسته اطلاعات شخصی را فاش کند، چون ساخت پیش‌نمایش روی دستگاه انجام می‌شود.

  - point: گیرنده را تایید کنید
    priority: Optional
    details: >-
      مطمئن شوید با گیرنده درست صحبت می‌کنید و حساب او به خطر نیفتاده است. یک روش، استفاده از برنامه‌هایی با تایید مخاطب است.

  - point: پیام‌های موقت را فعال کنید
    priority: Optional
    details: >-
      پیام‌های خودتخریب‌گر بعد از زمان مشخص به‌صورت خودکار حذف می‌شوند. اگر دستگاه گم یا ضبط شود، مهاجم فقط به پیام‌های
      اخیر دسترسی خواهد داشت.

  - point: از SMS پرهیز کنید
    priority: Optional
    details: >-
      SMS راحت است اما امن نیست و در برابر رهگیری، تعویض سیم‌کارت، دست‌کاری و بدافزار آسیب‌پذیر است.

  - point: مراقب ردیاب‌ها باشید
    priority: Optional
    details: >-
      مراقب پیام‌رسان‌هایی با ردیاب باشید؛ آمار دقیق استفاده می‌تواند بسیار تهاجمی باشد و گاهی هویت و اطلاعات شخصی
      شما را افشا کند.

  - point: حوزه قضایی را در نظر بگیرید
    priority: Advanced
    details: >-
      حوزه قضایی محل استقرار سازمان و میزبانی داده‌ها را در نظر بگیرید.

  - point: از پلتفرم ناشناس استفاده کنید
    priority: Advanced
    details: >-
      اگر احتمال هدف قرار گرفتن وجود دارد، از پیام‌رسان ناشناس استفاده کنید که برای ثبت‌نام شماره تلفن یا اطلاعات
      شناسایی‌شونده نخواهد.

  - point: از پشتیبانی Forward Secrecy مطمئن شوید
    priority: Advanced
    details: >-
      پلتفرمی را انتخاب کنید که Forward Secrecy دارد؛ یعنی برای هر پیام کلید رمزنگاری جدید ساخته می‌شود.

  - point: پلتفرم غیرمتمرکز را در نظر بگیرید
    priority: Advanced
    details: >-
      اگر همه داده‌ها از یک ارائه‌دهنده مرکزی عبور کند، باید به او با داده و فراداده اعتماد کنید. بدون درِ پشتی
      نمی‌توانید اصالت سیستم را مستقل بررسی کنید.
  softwareLinks:
    - title: پیام‌رسان‌های امن
      url: https://awesome-privacy.xyz#encrypted-messaging
    - title: پلتفرم‌های پیام‌رسانی همتا به همتا
      url: https://awesome-privacy.xyz#p2p-messaging
  color: cyan

- title: شبکه‌های اجتماعی
  slug: social-media
  description: کاهش ریسک‌های مرتبط با استفاده از جوامع آنلاین
  icon: social
  intro: >
    جوامع آنلاین از ابتدای اینترنت وجود داشته‌اند و به مردم امکان اتصال، گفتگو و اشتراک‌گذاری می‌دهند.
    با اینکه این شبکه‌ها تعامل اجتماعی را تقویت می‌کنند، جنبه تاریکی هم دارند: نگرانی‌های جدی
    [حریم خصوصی در شبکه‌های اجتماعی](https://en.wikipedia.org/wiki/Privacy_concerns_with_social_networking_services)،
    و این پلتفرم‌ها غالبا توسط شرکت‌های خصوصی اداره می‌شوند که از جمع‌آوری داده‌های افراد و فروش آن
    (اغلب به تبلیغ‌کنندگان ثالث) کسب درآمد می‌کنند.

    حساب خود را امن کنید و تنظیمات حریم خصوصی را محدود کنید، اما بدانید حتی پس از آن، داده‌های بارگذاری‌شده
    (خواسته یا ناخواسته) عملا عمومی است. اگر ممکن است از شبکه‌های اجتماعی رایج استفاده نکنید.
  checklist:
  - point: حساب خود را امن کنید
    priority: Essential
    details: >-
      پروفایل‌های شبکه اجتماعی اغلب دزدیده یا تصاحب می‌شوند. برای محافظت از حساب: گذرواژه قوی و یکتا داشته باشید
      و 2FA را فعال کنید.

  - point: تنظیمات حریم خصوصی را بررسی کنید
    priority: Essential
    details: >-
      بیشتر شبکه‌های اجتماعی امکان کنترل حریم خصوصی را می‌دهند. مطمئن شوید با داده‌هایی که نمایش می‌دهید و اینکه
      به چه کسانی نمایش داده می‌شود راحت هستید.

  - point: همه تعاملات را عمومی فرض کنید
    priority: Essential
    details: >-
      هنوز روش‌های زیادی برای دیدن محتوای «خصوصی» کاربران وجود دارد. قبل از بارگذاری یا نظر دادن بپرسید:
      «اگر این کاملا عمومی شود، مشکلی دارم؟»

  - point: همه تعاملات را دائمی فرض کنید
    priority: Essential
    details: >-
      تقریبا هر پست، نظر و عکس توسط سرویس‌های متعدد ثالث پشتیبان‌گیری می‌شود و این داده‌ها را آرشیو و قابل جست‌وجو
      می‌کنند؛ تقریبا برای همیشه.

  - point: بیش از حد افشا نکنید
    priority: Essential
    details: >-
      اطلاعات پروفایل معدن طلا برای هکرهاست و به شخصی‌سازی فیشینگ کمک می‌کند. جزئیات زیاد (تاریخ تولد، زادگاه،
      مدرسه و...) را منتشر نکنید.

  - point: درباره آنچه بارگذاری می‌کنید محتاط باشید
    priority: Essential
    details: >-
      وضعیت‌ها، نظرها، چک‌این‌ها و رسانه‌ها ممکن است ناخواسته اطلاعات بیشتری افشا کنند، به‌ویژه عکس‌ها و ویدئوهایی
      که جزئیات پس‌زمینه را نشان می‌دهند.

  - point: ایمیل یا شماره تلفن را منتشر نکنید
    priority: Essential
    details: >-
      انتشار ایمیل واقعی یا شماره موبایل به هکرها، ترول‌ها و اسپمرها ابزار بیشتری می‌دهد و می‌تواند باعث اتصال
      پروفایل‌ها و داده‌های جداگانه شود.

  - point: مجوزهای غیرضروری ندهید
    priority: Essential
    details: >-
      بسیاری از اپ‌های شبکه اجتماعی به‌صورت پیش‌فرض دسترسی به مخاطبین، تماس‌ها، موقعیت مکانی و تاریخچه پیام‌ها
      را می‌خواهند. اگر نیاز ندارند، مجوز ندهید.

  - point: درباره یکپارچگی‌های شخص ثالث محتاط باشید
    priority: Essential
    details: >-
      از ثبت‌نام با «ورود از طریق شبکه اجتماعی» خودداری کنید و دسترسی اپ‌هایی که دیگر استفاده نمی‌کنید را لغو کنید.

  - point: هنگام حضور در مکان، داده مکانی منتشر نکنید
    priority: Essential
    details: >-
      اگر محتوایی مکان را آشکار می‌کند، تا بعد از ترک آنجا صبر کنید. این مورد به‌ویژه هنگام سفر، رستوران،
      دانشگاه، هتل/اقامتگاه، ساختمان عمومی یا فرودگاه مهم است.

  - point: قبل از بارگذاری رسانه، فراداده را حذف کنید
    priority: Optional
    details: >-
      بیشتر گوشی‌ها و برخی دوربین‌ها مجموعه‌ای از داده‌های اضافی (EXIF) را به هر عکس اضافه می‌کنند. قبل از بارگذاری
      این داده‌ها را حذف کنید.

  - point: پوشاندن چهره در تصویر را در نظر بگیرید
    priority: Advanced
    details: >-
      ابزارهایی مثل Fawkes می‌توانند ساختار چهره را در عکس‌ها به‌طور ظریف تغییر دهند؛ برای انسان نامحسوس است اما
      باعث می‌شود سیستم‌های تشخیص چهره نتوانند چهره را تشخیص دهند.

  - point: جعل GPS در نزدیکی خانه را در نظر بگیرید
    priority: Advanced
    details: >-
      حتی اگر خودتان از شبکه اجتماعی استفاده نکنید، دیگران ممکن است بی‌احتیاط باشند و مکان شما را افشا کنند.

  - point: استفاده از اطلاعات جعلی را در نظر بگیرید
    priority: Advanced
    details: >-
      اگر فقط قصد خواندن دارید و نمی‌خواهید زیاد پست بگذارید، از نام مستعار و اطلاعات تماس جعلی استفاده کنید.

  - point: اصلا حساب شبکه اجتماعی نداشته باشید
    priority: Advanced
    details: >-
      شبکه‌های اجتماعی ذاتا خصوصی نیستند. برای بیشترین امنیت و حریم خصوصی، از شبکه‌های اجتماعی رایج استفاده نکنید.

  softwareLinks:
    - title: شبکه‌های اجتماعی جایگزین
      url: https://awesome-privacy.xyz#social-networks
    - title: پلتفرم‌های ویدئویی جایگزین
      url: https://awesome-privacy.xyz#video-platforms
    - title: پلتفرم‌های وبلاگ‌نویسی جایگزین
      url: https://awesome-privacy.xyz#blogging-platforms
    - title: خبرخوان‌ها و گردآوری خبر
      url: https://awesome-privacy.xyz#news-readers-and-aggregation
