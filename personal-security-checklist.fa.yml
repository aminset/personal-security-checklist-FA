- title: احراز هویت
  slug: authentication
  description: محافظت از اطلاعات ورود حساب‌های آنلاین
  icon: password
  color: yellow
  intro: >-
    بیشتر نشت‌های داده گزارش‌شده به دلیل استفاده از گذرواژه‌های ضعیف، پیش‌فرض یا دزدیده‌شده است
    (طبق [این گزارش Verizon](http://www.verizonenterprise.com/resources/reports/rp_dbir-2016-executive-summary_xg_en.pdf)).
    از گذرواژه‌های بلند، قوی و یکتا استفاده کنید، آن‌ها را در یک مدیر گذرواژه امن مدیریت کنید،
    احراز هویت دومرحله‌ای را فعال کنید، نشت‌ها را پیگیری کنید و هنگام ورود به حساب‌ها دقت داشته باشید.
  checklist:
  - point: استفاده از گذرواژه قوی
    priority: Essential
    details: >-
      اگر گذرواژه شما خیلی کوتاه باشد یا شامل کلمات فرهنگ لغت، مکان‌ها یا نام‌ها باشد، به راحتی با
      حمله جست‌وجوی فراگیر (brute force) شکسته می‌شود یا قابل حدس است. ساده‌ترین راه برای ساخت گذرواژه قوی،
      بلند بودن آن است (۱۲ کاراکتر یا بیشتر) — می‌توانید از «عبارت عبور» شامل چند کلمه استفاده کنید. یا
      از مولد گذرواژه برای ساخت گذرواژه‌ای بلند، قوی و تصادفی بهره بگیرید. ابزار
      [How Secure Is My Password? از Security.org](https://security.org/how-secure-is-my-password/) را امتحان کنید
      تا ببینید گذرواژه‌های رایج چقدر سریع شکسته می‌شوند. درباره ساخت گذرواژه قوی بیشتر بخوانید:
      [securityinabox.org](https://securityinabox.org/en/passwords/passwords-and-2fa/).

  - point: گذرواژه را تکرار نکنید
    priority: Essential
    details: >-
      اگر کسی از یک گذرواژه در چند سایت استفاده کند و یکی از آن‌ها دچار نشت شود، مجرم می‌تواند به‌سادگی
      به دیگر حساب‌ها دسترسی پیدا کند. این کار معمولا با درخواست‌های ورود خودکار در مقیاس بزرگ انجام می‌شود
      و به آن Credential Stuffing می‌گویند. متاسفانه رایج است، اما پیشگیری ساده است — برای هر حساب آنلاین
      یک گذرواژه متفاوت داشته باشید.

  - point: استفاده از مدیر گذرواژه امن
    priority: Essential
    details: >-
      برای بیشتر افراد، به خاطر سپردن صدها گذرواژه قوی و یکتا تقریبا غیرممکن است. مدیر گذرواژه برنامه‌ای است
      که اطلاعات ورود شما را تولید، ذخیره و به‌صورت خودکار پر می‌کند. همه گذرواژه‌های شما با یک گذرواژه اصلی
      رمزنگاری می‌شوند (که باید به خاطر بسپارید و بسیار قوی باشد). بیشتر مدیران گذرواژه افزونه مرورگر و برنامه
      موبایل دارند، بنابراین روی هر دستگاهی که هستید گذرواژه‌ها خودکار پر می‌شوند. گزینه‌ای همه‌فن‌حریف
      [Bitwarden](https://awesome-privacy.xyz/essentials/password-managers/bitwarden) است، یا
      [مدیران گذرواژه پیشنهادی](https://awesome-privacy.xyz/essentials/password-managers) را ببینید.

  - point: از اشتراک‌گذاری گذرواژه پرهیز کنید
    priority: Essential
    details: >-
      گاهی ممکن است لازم باشد دسترسی یک حساب را با شخص دیگری به اشتراک بگذارید، اما در حالت کلی از این کار
      اجتناب کنید چون احتمال نفوذ را افزایش می‌دهد. اگر واقعا نیاز به اشتراک‌گذاری دارید — مثلا در تیمی با
      حساب مشترک — این کار را از طریق قابلیت‌های داخلی مدیر گذرواژه انجام دهید.

  - point: فعال‌سازی احراز هویت دومرحله‌ای
    priority: Essential
    details: >-
      در 2FA باید هم چیزی که می‌دانید (گذرواژه) و هم چیزی که دارید (مثل کد روی گوشی) ارائه شود. بنابراین اگر
      کسی گذرواژه شما را داشته باشد (مثلا با فیشینگ، بدافزار یا نشت داده)، نمی‌تواند وارد حساب شما شود. شروع
      کار ساده است: یک [برنامه احرازکننده](https://awesome-privacy.xyz#2-factor-authentication) روی
      گوشی نصب کنید، سپس در تنظیمات امنیتی حساب مراحل فعال‌سازی 2FA را دنبال کنید. دفعه بعد که روی دستگاه جدید
      وارد شوید، کدی که در برنامه نمایش داده می‌شود را وارد می‌کنید (بدون اینترنت کار می‌کند و معمولا هر ۳۰
      ثانیه تغییر می‌کند).

  - point: کدهای پشتیبان را امن نگه دارید
    priority: Essential
    details: >-
      هنگام فعال‌سازی احراز هویت چندمرحله‌ای، معمولا چند کد پشتیبان دریافت می‌کنید که در صورت از دست رفتن یا
      خرابی روش 2FA بتوانید از آن‌ها استفاده کنید. این کدها را در جای امن نگه دارید تا گم نشوند یا به دست
      دیگران نیفتند. آن‌ها را روی کاغذ یا در محلی امن روی دیسک (مثل فضای آفلاین یا فایل/درایو رمزنگاری‌شده)
      نگه‌داری کنید. این کدها را در مدیر گذرواژه ذخیره نکنید؛ منابع 2FA و گذرواژه‌ها باید جدا باشند.

  - point: ثبت‌نام برای هشدار نشت داده
    priority: Optional
    details: >-
      پس از یک نشت بزرگ، داده‌های درز کرده اغلب در اینترنت منتشر می‌شوند. چندین وب‌سایت این داده‌ها را جمع‌آوری
      می‌کنند و امکان جست‌وجوی ایمیل شما را می‌دهند. سرویس‌های
      [Firefox Monitor](https://monitor.firefox.com)، [Have I Been Pwned](https://haveibeenpwned.com) و
      [DeHashed](https://dehashed.com) امکان پایش دارند و اگر ایمیل شما در مجموعه جدیدی دیده شود اطلاع می‌دهند.
      دانستن این موضوع در اسرع وقت مفید است تا گذرواژه حساب‌های آسیب‌دیده را تغییر دهید.
      [Have I Been Pwned](https://awesome-privacy.xyz/security-tools/online-tools/have-i-been-pwned) همچنین اعلان
      سراسری دامنه دارد و می‌تواند در صورت ظاهر شدن ایمیل‌های دامنه شما هشدار بدهد (برای زمانی که از
      نام‌های مستعار در [فورواردینگ ناشناس](https://awesome-privacy.xyz#anonymous-mail-forwarding) استفاده می‌کنید).

  - point: پوشاندن گذرواژه/پین هنگام ورود
    priority: Optional
    details: >-
      هنگام تایپ گذرواژه در مکان‌های عمومی، مطمئن شوید در دید مستقیم دوربین مداربسته نیستید و کسی از پشت سر
      صفحه را نمی‌بیند. هنگام تایپ، دست خود را روی صفحه‌کلید بگیرید و گذرواژه‌های متن‌واضح را روی صفحه نشان ندهید.

  - point: گذرواژه‌های حیاتی را دوره‌ای به‌روزرسانی کنید
    priority: Optional
    details: >-
      نشت پایگاه‌داده‌ها رایج است و احتمالا چند گذرواژه شما همین حالا جایی در اینترنت وجود دارد. تغییر دوره‌ای
      گذرواژه حساب‌های حساس می‌تواند ریسک را کاهش دهد. اما اگر گذرواژه‌هایتان بلند، قوی و یکتا باشند، نیازی
      نیست خیلی مکرر این کار را انجام دهید — سالی یک‌بار کافی است. الزام به تغییر دوره‌ای گذرواژه در سازمان‌ها
      [دیگر توصیه نمی‌شود](https://duo.com/decipher/microsoft-will-no-longer-recommend-forcing-periodic-password-changes)،
      چون باعث انتخاب گذرواژه‌های ضعیف‌تر می‌شود.

  - point: گذرواژه را در مرورگر ذخیره نکنید
    priority: Optional
    details: >-
      بیشتر مرورگرها پیشنهاد ذخیره اطلاعات ورود را می‌دهند. این کار را نپذیرید، چون همیشه رمزنگاری نشده‌اند و
      ممکن است امکان دسترسی به حساب‌هایتان را فراهم کنند. به‌جایش از مدیر گذرواژه برای ذخیره و پرکردن خودکار
      گذرواژه‌ها استفاده کنید.

  - point: از ورود در دستگاه دیگران خودداری کنید
    priority: Optional
    details: >-
      روی رایانه دیگران وارد حساب‌های خود نشوید، چون نمی‌توانید مطمئن باشید سیستم آن‌ها پاک است. درباره دستگاه‌های
      عمومی محتاط‌تر باشید چون بدافزار و ردیابی در آن‌ها رایج‌تر است. استفاده از دستگاه دیگران برای حساب‌های حساس
      مثل بانکداری آنلاین بسیار خطرناک است. اگر مجبور شدید، حتما از نشست خصوصی/ناشناس استفاده کنید
      (Ctrl+Shift+N یا Cmd+Shift+N) تا مرورگر اطلاعات ورود، کوکی‌ها و تاریخچه را ذخیره نکند.

  - point: از راهنمای گذرواژه پرهیز کنید
    priority: Optional
    details: >-
      برخی سایت‌ها اجازه می‌دهند راهنمای گذرواژه تعیین کنید. اغلب حدس زدن پاسخ‌ها آسان است. اگر اجباری بود،
      پاسخ‌های تصادفی انتخاب کنید و آن‌ها را در مدیر گذرواژه ذخیره کنید
      (`نام اولین مدرسه: 6D-02-8B-!a-E8-8F-81`).

  - point: به پرسش‌های امنیتی واقعی پاسخ ندهید
    priority: Optional
    details: >-
      اگر سایتی پرسش امنیتی می‌پرسد (مثل محل تولد، نام خانوادگی مادر یا اولین خودرو)، پاسخ واقعی ندهید. برای
      هکرها یافتن این اطلاعات با جست‌وجوی آنلاین یا مهندسی اجتماعی آسان است. به‌جایش پاسخ ساختگی بسازید و در
      مدیر گذرواژه ذخیره کنید. استفاده از واژه‌های واقعی بهتر از کاراکترهای تصادفی است
      (طبق [این توضیح](https://news.ycombinator.com/item?id=29244870)).

  - point: از پین ۴ رقمی استفاده نکنید
    priority: Optional
    details: >-
      برای گوشی یا رایانه از پین کوتاه استفاده نکنید. به‌جایش از گذرواژه متنی یا پین بسیار طولانی‌تر استفاده کنید.
      پین‌های عددی به‌راحتی شکسته می‌شوند (پین ۴ رقمی فقط ۱۰ هزار ترکیب دارد، در حالی که کد ۴ کاراکتری حروفی-عددی
      ۷.۴ میلیون ترکیب دارد).

  - point: از پیامک برای 2FA استفاده نکنید
    priority: Optional
    details: >-
      هنگام فعال‌سازی احراز هویت چندمرحله‌ای، اگر امکان دارد از کدهای برنامه‌ای یا توکن سخت‌افزاری استفاده کنید.
      پیامک در برابر تهدیدهایی مثل [تعویض سیم‌کارت](https://www.maketecheasier.com/sim-card-hijacking) و
      [رهگیری](https://secure-voice.com/ss7_attacks) آسیب‌پذیر است. همچنین معلوم نیست شماره شما چقدر امن نگه‌داری
      می‌شود یا برای چه کارهای دیگری استفاده می‌شود. از نظر عملی نیز پیامک فقط با آنتن‌دهی کار می‌کند و ممکن است
      کند باشد. اگر برای بازیابی حساب مجبور به استفاده از شماره پیامکی هستید، بهتر است یک شماره اعتباری جداگانه فقط
      برای بازیابی داشته باشید.

  - point: از مدیر گذرواژه برای تولید OTP استفاده نکنید
    priority: Advanced
    details: >-
      بسیاری از مدیران گذرواژه قادر به تولید کدهای 2FA هستند. بهتر است از مدیر گذرواژه اصلی خود به‌عنوان
      احرازکننده 2FA استفاده نکنید، چون در صورت نفوذ، یک نقطه شکست واحد ایجاد می‌شود. به‌جایش از یک
      [برنامه احرازکننده](https://awesome-privacy.xyz#2-factor-authentication) مجزا روی گوشی یا لپ‌تاپ
      استفاده کنید.

  - point: از باز کردن با چهره پرهیز کنید
    priority: Advanced
    details: >-
      بیشتر گوشی‌ها و لپ‌تاپ‌ها قابلیت احراز هویت چهره دارند و با دوربین تصویر چهره را با هش ذخیره‌شده مقایسه می‌کنند.
      این روش راحت است، اما راه‌های زیادی برای [فریب دادن](https://www.forbes.com/sites/jvchamary/2017/09/18/security-apple-face-id-iphone-x/)
      آن و دسترسی به دستگاه با عکس دیجیتال یا بازسازی از تصاویر دوربین مداربسته وجود دارد. برخلاف گذرواژه،
      احتمالا عکس‌ها و ویدئوهایی از چهره شما در اینترنت یا دوربین‌ها وجود دارد.

  - point: مراقب کی‌لاگرها باشید
    priority: Advanced
    details: >-
      [کی‌لاگر سخت‌افزاری](https://en.wikipedia.org/wiki/Hardware_keylogger) دستگاهی فیزیکی است که بین کیبورد و پورت USB
      قرار می‌گیرد و همه کلیدها را ثبت می‌کند و گاهی به سرور راه دور می‌فرستد. این کار به هکر دسترسی به هر چیزی که
      تایپ می‌کنید (از جمله گذرواژه‌ها) می‌دهد. بهترین راه محافظت، بررسی اتصال USB پس از رها کردن سیستم است.
      ممکن است کی‌لاگر داخل بدنه کیبورد هم نصب شود، پس نشانه‌های دست‌کاری را بررسی کنید و اگر لازم است کیبورد
      خودتان را همراه ببرید. داده‌هایی که با صفحه‌کلید مجازی تایپ می‌شوند، از کلیپ‌بورد چسبانده می‌شوند یا توسط
      مدیر گذرواژه خودکار پر می‌شوند، توسط کی‌لاگر سخت‌افزاری قابل رهگیری نیستند.

  - point: استفاده از توکن سخت‌افزاری را در نظر بگیرید
    priority: Advanced
    details: >-
      کلید امنیتی U2F/FIDO2 یک دستگاه USB (یا NFC) است که هنگام ورود به سرویس آنلاین وارد می‌کنید تا هویت شما را
      به‌جای وارد کردن OTP تایید کند. [SoloKey](https://solokeys.com) و [NitroKey](https://www.nitrokey.com) نمونه‌هایی
      از این کلیدها هستند. این روش مزایای امنیتی زیادی دارد. چون مرورگر مستقیم با دستگاه ارتباط می‌گیرد، نمی‌توان
      آن را درباره میزبان درخواست‌کننده فریب داد، زیرا گواهی TLS بررسی می‌شود. [این مطلب](https://security.stackexchange.com/a/71704)
      توضیح خوبی درباره امنیت توکن‌های FIDO U2F است. البته کلید فیزیکی را باید در جای امن نگه‌داری کنید یا همراه خود
      داشته باشید. برخی حساب‌ها اجازه می‌دهند چند روش 2FA هم‌زمان فعال باشد.

  - point: مدیر گذرواژه آفلاین را در نظر بگیرید
    priority: Advanced
    details: >-
      برای امنیت بیشتر، یک مدیر گذرواژه آفلاین رمزنگاری‌شده کنترل کامل داده‌ها را به شما می‌دهد.
      [KeePass](https://awesome-privacy.xyz/essentials/password-managers/keepass) گزینه‌ای محبوب است و افزونه‌ها و فورک‌های
      متعددی با سازگاری و امکانات بیشتر دارد. کلاینت‌های محبوب شامل: [KeePassXC](https://keepassxc.org) (دسکتاپ)،
      [KeePassDX](https://www.keepassdx.com) (اندروید) و [StrongBox](https://apps.apple.com/us/app/strongbox-password-safe/id897283731)
      (iOS) هستند. ایراد آن این است که ممکن است کمی کم‌راحت‌تر باشد و پشتیبان‌گیری و نگه‌داری امن به عهده شماست.

  - point: نام کاربری یکتا را در نظر بگیرید
    priority: Advanced
    details: >-
      داشتن گذرواژه‌های متفاوت برای هر حساب گام خوبی است، اما اگر همچنین نام کاربری، ایمیل یا شماره تلفن یکتا برای ورود
      استفاده کنید، دسترسی غیرمجاز بسیار سخت‌تر می‌شود. ساده‌ترین روش برای داشتن چند ایمیل، استفاده از نام‌های مستعار
      خودکار برای فورواردینگ ناشناس است؛ به‌طوری که [هرچیزی]@yourdomain.com به صندوق شما می‌رسد و می‌توانید برای هر حساب
      ایمیل متفاوت داشته باشید (نگاه کنید به [ارائه‌دهندگان نام مستعار ایمیل](https://awesome-privacy.xyz#mail-forwarding)).
      نام‌های کاربری ساده‌ترند چون می‌توانید با مدیر گذرواژه تولید، ذخیره و خودکار پرشان کنید. شماره‌های مجازی نیز از
      طریق ارائه‌دهنده VOIP قابل تهیه‌اند.
  softwareLinks:
    - title: مدیران گذرواژه
      url: https://awesome-privacy.xyz/essentials/password-managers
    - title: احراز هویت دومرحله‌ای
      url: https://awesome-privacy.xyz/essentials/2-factor-authentication

- title: مرور وب
  slug: web-browsing
  description: اجتناب از ردیابی، سانسور و جمع‌آوری داده در اینترنت
  icon: browser
  intro: >-
    بیشتر وب‌سایت‌ها از نوعی ردیابی استفاده می‌کنند تا رفتار و ترجیحات کاربران را بفهمند. این داده‌ها
    می‌تواند بسیار دقیق باشد و برای شرکت‌ها، دولت‌ها و دزدان مالکیت فکری ارزش زیادی دارد. نشت داده‌ها
    رایج است و بی‌نام‌سازی فعالیت وب کاربران اغلب کار ساده‌ای است.


    دو روش اصلی ردیابی وجود دارد: حالت‌دار (مبتنی بر کوکی) و بی‌حالت (مبتنی بر اثرانگشت). کوکی‌ها قطعات
    کوچکی از اطلاعات هستند که در مرورگر شما ذخیره می‌شوند و با شناسه یکتا شما را شناسایی می‌کنند. اثرانگشت
    مرورگر روشی بسیار دقیق برای شناسایی و ردیابی کاربران است. اطلاعات جمع‌آوری‌شده گسترده است و شامل جزئیات
    مرورگر، سیستم‌عامل، وضوح صفحه، فونت‌های پشتیبانی‌شده، افزونه‌ها، منطقه زمانی، زبان و حتی پیکربندی سخت‌افزار می‌شود.


    این بخش گام‌هایی را نشان می‌دهد تا بهتر در برابر تهدیدها محافظت شوید، ردیابی آنلاین را کاهش دهید و
    حریم خصوصی را بهبود دهید.
  checklist:
  - point: مسدود کردن تبلیغات
    priority: Essential
    details: >-
      استفاده از مسدودکننده تبلیغات می‌تواند با بستن ردیاب‌های تبلیغاتی حریم خصوصی شما را بهبود دهد.
      افزونه [uBlock Origin](https://awesome-privacy.xyz/networking/ad-blockers/ublock-origin) یک افزونه بسیار
      کارآمد و متن‌باز است که توسط Raymond Hill توسعه داده شده. وقتی تبلیغات شخص ثالث در صفحه نمایش داده می‌شوند،
      می‌توانند شما را ردیابی کرده و اطلاعات شخصی و عادات‌تان را جمع کنند؛ سپس این داده‌ها فروخته می‌شوند یا برای
      نمایش تبلیغات هدفمندتر استفاده می‌شوند. برخی تبلیغات نیز کاملا مخرب یا جعلی‌اند. مسدود کردن تبلیغات باعث
      بارگذاری سریع‌تر صفحات، مصرف کمتر داده و تجربه‌ای خلوت‌تر می‌شود.

  - point: اطمینان از معتبر بودن وب‌سایت
    priority: Basic
    details: >-
      شاید بدیهی باشد، اما هنگام ورود به هر حساب آنلاین، آدرس URL را دوباره بررسی کنید. ذخیره سایت‌های پرکاربرد
      در بوکمارک راه خوبی برای دسترسی سریع به URL درست است. هنگام بازدید از سایت‌های جدید، نشانه‌های ناامن بودن
      را بررسی کنید: هشدارهای مرورگر، ریدایرکت‌ها، اسپم داخل سایت و پاپ‌آپ‌ها. اگر مطمئن نبودید، می‌توانید با
      ابزارهایی مثل [Virus Total](https://awesome-privacy.xyz/security-tools/online-tools/virus-total)،
      [IsLegitSite](https://www.islegitsite.com) یا
      [Google Safe Browsing Status](https://transparencyreport.google.com/safe-browsing/search) بررسی کنید.

  - point: مراقب بدافزارهای مرورگر باشید
    priority: Basic
    details: >-
      سیستم یا مرورگر شما ممکن است توسط جاسوس‌افزار، ماینر، رباینده مرورگر، ریدایرکت‌های مخرب، ادور و... آلوده شود.
      معمولا با نادیده گرفتن پاپ‌آپ‌ها، دقت در کلیک‌ها و توقف در صورت هشدار مرورگر می‌توانید محافظت بمانید. نشانه‌های
      رایج شامل تغییر موتور جست‌وجو یا صفحه اصلی، نوارابزارهای ناشناس، افزونه‌ها یا آیکون‌های ناآشنا، افزایش شدید تبلیغات،
      خطاها و کند شدن غیرعادی صفحات است. این مقالات Heimdal نشانه‌ها، روش‌های آلودگی و حذف بدافزار مرورگر را توضیح می‌دهند:
      [نشانه‌ها](https://heimdalsecurity.com/blog/warning-signs-operating-system-infected-malware)،
      [چطور آلوده می‌شود](https://heimdalsecurity.com/blog/practical-online-protection-where-malware-hides)،
      [چگونه حذف کنیم](https://heimdalsecurity.com/blog/malware-removal).

  - point: استفاده از مرورگر سازگار با حریم خصوصی
    priority: Essential
    details: >-
      [Firefox](https://awesome-privacy.xyz/essentials/browsers/firefox) (با چند تنظیم)
      و [Brave](https://awesome-privacy.xyz/essentials/browsers/brave-browser) مرورگرهای امن و حریم‌خصوصی‌محور هستند.
      هر دو سریع، متن‌باز، کاربرپسند و روی همه سیستم‌عامل‌های اصلی در دسترس‌اند. مرورگر شما به تمام فعالیت‌های آنلاین
      دسترسی دارد، پس اگر ممکن است از Google Chrome، Edge و Safari پرهیز کنید چون (بدون تنظیم درست) داده‌های استفاده را
      جمع‌آوری می‌کنند و امکان ردیابی تهاجمی می‌دهند. برای امنیت بهتر Firefox به چند تغییر نیاز دارد؛ مثل
      [arkenfox](https://github.com/arkenfox/user.js/wiki) یا تنظیمات user.js
      [12byte](https://12bytes.org/firefox-configuration-guide-for-privacy-freaks-and-performance-buffs/).
      بیشتر بخوانید: [مرورگرهای حریم‌خصوصی](https://awesome-privacy.xyz#browsers).

  - point: استفاده از موتور جست‌وجوی خصوصی
    priority: Essential
    details: >-
      استفاده از موتور جست‌وجوی غیرردیاب و حریم‌خصوصی‌محور ریسک ثبت یا سوءاستفاده از واژه‌های جست‌وجوی شما را کاهش می‌دهد.
      [DuckDuckGo](https://awesome-privacy.xyz/essentials/search-engines/duckduckgo) یا
      [Qwant](https://awesome-privacy.xyz/essentials/search-engines/qwant) را در نظر بگیرید.
      گوگل سیاست‌های ردیابی [بسیار تهاجمی](https://hackernoon.com/data-privacy-concerns-with-google-b946f2b7afea) دارد و
      سابقه نمایش نتایج [سوگیرانه](https://www.businessinsider.com/evidence-that-google-search-results-are-biased-2014-10).
      بنابراین Google به همراه Bing، Baidu، Yahoo و Yandex برای کسانی که به حریم خصوصی اهمیت می‌دهند مناسب نیستند. پیشنهاد
      می‌شود [جست‌وجوی پیش‌فرض مرورگر](https://duckduckgo.com/install) را به یک موتور حریم‌خصوصی تغییر دهید.

  - point: حذف افزونه‌های غیرضروری مرورگر
    priority: Essential
    details: >-
      افزونه‌ها می‌توانند هر چیزی که در مرورگر انجام می‌دهید را ببینند، ثبت کنند یا تغییر دهند و بعضی افزونه‌های
      ظاهرا بی‌خطر نیت‌های مخرب دارند. وب‌سایت‌ها می‌توانند افزونه‌های نصب‌شده را ببینند و برای تقویت اثرانگشت
      شما استفاده کنند. فروشگاه‌های افزونه Firefox و Chrome اجازه می‌دهند قبل از نصب، دسترسی‌های موردنیاز
      افزونه را ببینید. نظرات را بررسی کنید. فقط افزونه‌های لازم را نگه دارید و موارد بدون استفاده را حذف کنید.

  - point: مرورگر را به‌روز نگه دارید
    priority: Essential
    details: >-
      آسیب‌پذیری‌های مرورگر مرتب [کشف](https://cve.mitre.org/cgi-bin/cvekey.cgi?keyword=browser) و وصله می‌شوند؛
      پس به‌روز نگه داشتن برای جلوگیری از سوءاستفاده صفرروزه مهم است. می‌توانید
      [نسخه مرورگر خود را اینجا ببینید](https://www.whatismybrowser.com/) یا
      [این راهنما](https://www.whatismybrowser.com/guides/how-to-update-your-browser/) را برای به‌روزرسانی دنبال کنید.
      برخی مرورگرها خودکار به آخرین نسخه پایدار به‌روز می‌شوند.

  - point: بررسی HTTPS
    priority: Essential
    details: >-
      اگر در وب‌سایت بدون HTTPS اطلاعات وارد کنید، داده‌ها بدون رمزنگاری منتقل می‌شوند و هر کسی که رهگیری کند
      می‌تواند آن را بخواند. روی سایت‌های بدون HTTPS اطلاعات وارد نکنید، اما قفل سبز هم همیشه نشانه اعتبار نیست؛
      داشتن گواهی SSL به معنی قابل اعتماد بودن سایت نیست. افزونه [HTTPS-Everywhere](https://www.eff.org/https-everywhere)
      (توسعه‌یافته توسط [EFF](https://www.eff.org/)) قبلا HTTPS را خودکار فعال می‌کرد اما از ۲۰۲۲ منقضی شده است.
      EFF در [این مقاله](https://www.eff.org/) توضیح داده که مرورگرها اکنون این محافظت را داخلی دارند و برای
      [Firefox](https://awesome-privacy.xyz/essentials/browsers/firefox)، Chrome، Edge و Safari نیز راهنمای فعال‌سازی ارائه کرده است.

  - point: استفاده از DNS-over-HTTPS
    priority: Essential
    details: >-
      DNS سنتی درخواست‌ها را به صورت متن ساده ارسال می‌کند و امکان شنود و دست‌کاری داده‌های DNS را فراهم می‌کند.
      DNS-over-HTTPS حل نام را از طریق HTTPS انجام می‌دهد و داده بین شما و حل‌کننده DNS رمزنگاری می‌شود.
      گزینه محبوب، [1.1.1.1](https://awesome-privacy.xyz/security-tools/mobile-apps/1.1.1.1) از
      [CloudFlare](https://awesome-privacy.xyz/networking/dns-providers/cloudflare) است؛ یا می‌توانید ارائه‌دهنده‌ها
      را مقایسه کنید. فعال‌سازی آن در مرورگر ساده است. توجه کنید که DoH چالش‌های خودش را دارد، از جمله کاهش قابلیت
      فیلترینگ وب.

  - point: کانتینرهای چندگانه [Session](https://awesome-privacy.xyz/communication/encrypted-messaging/session)
    priority: Essential
    details: >-
      جداسازی کارها برای کاهش هم‌بستگی‌ها بسیار مهم است. مثلا استفاده از پروفایل‌های جداگانه برای کار،
      مرور عمومی، شبکه‌های اجتماعی و خرید آنلاین باعث می‌شود واسطه‌های داده نتوانند فعالیت‌ها را به هم وصل کنند.
      می‌توانید از [Firefox Containers](https://awesome-privacy.xyz/security-tools/browser-extensions/firefox-multi-account-containers)
      استفاده کنید. یا برای کارهای مختلف مرورگرهای مختلف داشته باشید
      ([Brave](https://awesome-privacy.xyz/essentials/browsers/brave-browser)،
      [Firefox](https://awesome-privacy.xyz/essentials/browsers/firefox)،
      [Tor](https://awesome-privacy.xyz/networking/mix-networks/tor) و...).

  - point: استفاده از حالت ناشناس
    priority: Essential
    details: >-
      هنگام استفاده از دستگاه دیگران، حتما از نشست خصوصی/ناشناس استفاده کنید. این کار مانع ذخیره تاریخچه،
      کوکی‌ها و برخی داده‌ها می‌شود، اما کامل نیست و همچنان ممکن است ردیابی شوید.

  - point: اثرانگشت مرورگر خود را بشناسید
    priority: Essential
    details: >-
      اثرانگشت‌گیری مرورگر روشی بسیار دقیق برای ردیابی است که بر اساس اطلاعات دستگاه شما عمل می‌کند. می‌توانید
      اثرانگشت خود را در amiunique.org ببینید — هدف این است که تا حد ممکن غیرمنحصر به‌فرد باشید.

  - point: مدیریت کوکی‌ها
    priority: Essential
    details: >-
      پاک کردن منظم کوکی‌ها یکی از راه‌های کاهش ردیابی است. کوکی‌ها ممکن است توکن نشست را ذخیره کنند و اگر
      به دست فرد دیگری بیفتد، می‌تواند بدون گذرواژه به حساب‌ها دسترسی پیدا کند. برای کاهش ریسک، کوکی‌ها را
      مرتب پاک کنید.

  - point: مسدود کردن کوکی‌های شخص ثالث
    priority: Essential
    details: >-
      کوکی‌های شخص ثالث توسط سایتی غیر از سایتی که بازدید می‌کنید روی دستگاه شما قرار می‌گیرند. این موضوع
      یک ریسک حریم خصوصی است چون یک طرف سوم می‌تواند داده‌های نشست فعلی شما را جمع کند. این راهنما توضیح می‌دهد
      چگونه کوکی‌های شخص ثالث را غیرفعال کنید.

  - point: مسدود کردن ردیاب‌های شخص ثالث
    priority: Essential
    details: >-
      مسدود کردن ردیاب‌ها باعث می‌شود وب‌سایت‌ها، تبلیغ‌کنندگان و ابزارهای تحلیلی نتوانند در پس‌زمینه ردیابی کنند.
      [Privacy Badger](https://awesome-privacy.xyz/security-tools/browser-extensions/privacy-badger)،
      [DuckDuckGo Privacy Essentials](https://awesome-privacy.xyz/security-tools/browser-extensions/privacy-essentials)،
      [uBlock Origin](https://awesome-privacy.xyz/networking/ad-blockers/ublock-origin) و uMatrix (پیشرفته) همگی
      مسدودکننده‌های ردیاب متن‌باز و موثر برای مرورگرهای اصلی هستند.

  - point: مراقب ریدایرکت‌ها باشید
    priority: Optional
    details: >-
      برخی ریدایرکت‌ها بی‌ضررند، اما برخی (مثل ریدایرکت‌های اعتبارسنجی‌نشده) در حملات فیشینگ استفاده می‌شوند و
      لینک مخرب را معتبر جلوه می‌دهند. اگر درباره URL ریدایرکت مطمئن نیستید، با ابزاری مثل RedirectDetective مقصد
      را بررسی کنید.

  - point: در مرورگر خود وارد حساب نشوید
    priority: Optional
    details: >-
      بسیاری از مرورگرها امکان ورود و همگام‌سازی تاریخچه و بوکمارک‌ها را می‌دهند. این کار علاوه بر افزایش جمع‌آوری
      داده، سطح حمله را هم بیشتر می‌کند چون مسیر دیگری برای دستیابی به اطلاعات شخصی فراهم می‌شود.

  - point: خدمات پیش‌بینی را غیرفعال کنید
    priority: Optional
    details: >-
      برخی مرورگرها خدمات پیش‌بینی ارائه می‌دهند تا نتایج زنده یا تکمیل خودکار URL نشان دهند. با فعال بودن این گزینه،
      با هر کلید فشرده‌شده داده به Google (یا موتور جست‌وجوی پیش‌فرض) ارسال می‌شود، نه فقط پس از زدن Enter.

  - point: از Google Translate برای صفحات وب استفاده نکنید
    priority: Optional
    details: >-
      هنگام بازدید از صفحات زبان خارجی ممکن است پیشنهاد نصب افزونه Google Translate بدهد. توجه کنید که Google همه داده‌ها
      (از جمله فیلدهای ورودی) و جزئیات کاربر را جمع‌آوری می‌کند. به‌جایش از سرویس ترجمه‌ای که به مرورگر شما متصل نیست
      استفاده کنید.

  - point: اعلان‌های وب را غیرفعال کنید
    priority: Optional
    details: >-
      اعلان‌های پوش مرورگر روش رایجی برای فریب کاربران به کلیک روی لینک‌های مخرب است چون جعل منبع آسان است. از این
      موضوع آگاه باشید و اعلان‌های مرورگر را غیرفعال کنید.

  - point: دانلود خودکار را غیرفعال کنید
    priority: Optional
    details: >-
      دانلود ناخواسته فایل (Drive-by) راه رایجی برای وارد کردن فایل‌های مخرب به دستگاه است. با غیرفعال کردن دانلود
      خودکار و احتیاط نسبت به سایت‌هایی که ناگهانی درخواست دانلود دارند می‌توان ریسک را کاهش داد.

  - point: دسترسی به حسگرها را ممنوع کنید
    priority: Optional
    details: >-
      وب‌سایت‌های موبایل ممکن است بدون درخواست به حسگرهای دستگاه دسترسی داشته باشند. اگر یک‌بار به مرورگر این مجوز
      را بدهید، همه سایت‌ها می‌توانند بدون اجازه یا اعلان از آن استفاده کنند.

  - point: اشتراک‌گذاری موقعیت مکانی را غیرفعال کنید
    priority: Optional
    details: >-
      خدمات موقعیت مکانی به سایت‌ها اجازه می‌دهد برای بهبود تجربه، مکان شما را بخواهند. این گزینه را در تنظیمات
      غیرفعال کنید. توجه داشته باشید هنوز روش‌های دیگری برای تعیین موقعیت تقریبی شما وجود دارد.

  - point: دسترسی به دوربین/میکروفون را محدود کنید
    priority: Optional
    details: >-
      تنظیمات مرورگر را بررسی کنید تا هیچ سایتی مجوز دسترسی به وب‌کم یا میکروفون نداشته باشد. استفاده از پوش فیزیکی
      دوربین یا مسدودکننده میکروفون هم می‌تواند مفید باشد.

  - point: ذخیره گذرواژه در مرورگر را غیرفعال کنید
    priority: Optional
    details: >-
      اجازه ندهید مرورگر نام‌های کاربری و گذرواژه‌ها را ذخیره کند. این اطلاعات به‌راحتی قابل مشاهده یا دسترسی هستند.
      به‌جای آن از مدیر گذرواژه استفاده کنید.

  - point: تکمیل خودکار مرورگر را غیرفعال کنید
    priority: Optional
    details: >-
      تکمیل خودکار را برای اطلاعات محرمانه یا شخصی خاموش کنید. اگر مرورگر به هر شکلی به خطر بیفتد، این ویژگی می‌تواند
      آسیب‌زا باشد. به‌جایش از بخش Notes در مدیر گذرواژه استفاده کنید.

  - point: محافظت در برابر حمله Exfil
    priority: Optional
    details: >-
      حمله CSS Exfiltrate روشی است که در آن اطلاعات حساس تنها با CSS قابل سرقت است. برای محافظت می‌توانید از افزونه
      [CSS Exfil Protection](https://awesome-privacy.xyz/security-tools/browser-extensions/css-exfil-protection) استفاده کنید.

  - point: غیرفعال کردن ActiveX
    priority: Optional
    details: >-
      ActiveX یک API افزونه مرورگر است که در Microsoft IE به‌صورت پیش‌فرض فعال بوده است. امروز کمتر استفاده می‌شود،
      اما چون دسترسی‌های عمیق می‌دهد و خطرناک است باید غیرفعال شود.

  - point: غیرفعال کردن WebRTC
    priority: Optional
    details: >-
      WebRTC ارتباط صوتی/تصویری با کیفیت و اشتراک فایل همتا به همتا را از داخل مرورگر ممکن می‌کند، اما می‌تواند
      باعث نشت حریم خصوصی شود. برای اطلاعات بیشتر این راهنما را ببینید.

  - point: جعل امضای Canvas در HTML5
    priority: Optional
    details: >-
      اثرانگشت‌گیری Canvas به وب‌سایت‌ها اجازه می‌دهد کاربران را با دقت بالا شناسایی و ردیابی کنند. می‌توانید از
      افزونه Canvas-Fingerprint-Blocker برای جعل اثرانگشت یا از
      [Tor](https://awesome-privacy.xyz/networking/mix-networks/tor) استفاده کنید.

  - point: جعل User Agent
    priority: Optional
    details: >-
      User Agent به وب‌سایت می‌گوید از چه دستگاه، مرورگر و نسخه‌ای استفاده می‌کنید. تغییر دوره‌ای آن می‌تواند شما
      را کمتر منحصربه‌فرد کند.

  - point: بی‌اثر بودن DNT را در نظر بگیرید
    priority: Optional
    details: >-
      فعال‌سازی Do Not Track تاثیر بسیار محدودی دارد چون بسیاری از وب‌سایت‌ها به آن پایبند نیستند. از آن‌جا که کم
      استفاده می‌شود، ممکن است اثرانگشت شما را خاص‌تر کند.

  - point: جلوگیری از ردیابی HSTS
    priority: Optional
    details: >-
      HSTS برای امن‌سازی سایت‌ها طراحی شده اما نگرانی‌هایی درباره امکان کاشت سوپرکوکی مطرح شده است. می‌توان آن را در
      مرورگرهای مبتنی بر Chromium با رفتن به chrome://net-internals/#hsts غیرفعال کرد.

  - point: جلوگیری از اتصال‌های خودکار مرورگر
    priority: Optional
    details: >-
      حتی زمانی که از مرورگر استفاده نمی‌کنید، ممکن است برای گزارش فعالیت، تحلیل و عیب‌یابی با سرورهای خود ارتباط برقرار کند.
      می‌توانید بخشی از این موارد را از تنظیمات غیرفعال کنید.

  - point: فعال‌سازی جداسازی First-Party
    priority: Optional
    details: >-
      [First Party Isolation](https://awesome-privacy.xyz/security-tools/browser-extensions/first-party-isolation) یعنی
      همه منابع شناسایی و وضعیت مرورگر بر اساس دامنه نوار آدرس جدا می‌شود و ردیابی را به شدت کاهش می‌دهد.

  - point: حذف پارامترهای ردیابی از URL
    priority: Advanced
    details: >-
      وب‌سایت‌ها اغلب پارامترهای GET اضافی برای شناسایی منبع/ارجاع به URL اضافه می‌کنند. می‌توانید دستی پاک‌سازی کنید،
      یا از افزونه‌ای مثل [ClearURLs](https://awesome-privacy.xyz/security-tools/browser-extensions/clearurls) برای حذف
      خودکار داده‌های ردیابی استفاده کنید.

  - point: امنیت در اولین اجرا
    priority: Advanced
    details: >-
      پس از نصب مرورگر، اولین اجرای آن (قبل از تنظیمات حریم خصوصی) معمولا با ارتباط به سرورهای سازنده همراه است.
      بنابراین بعد از نصب، ابتدا اتصال اینترنت را قطع کنید، تنظیمات حریم خصوصی را انجام دهید و سپس اینترنت را وصل کنید.

  - point: استفاده از مرورگر Tor
    priority: Advanced
    details: >-
      پروژه [Tor](https://awesome-privacy.xyz/networking/mix-networks/tor) مرورگری ارائه می‌کند که ترافیک شما را
      رمزنگاری کرده و از چند گره عبور می‌دهد تا از رهگیری و ردیابی در امان باشید. ایراد اصلی سرعت و تجربه کاربری است.

  - point: غیرفعال کردن JavaScript
    priority: Advanced
    details: >-
      بسیاری از وب‌اپ‌های مدرن مبتنی بر JavaScript هستند، پس غیرفعال کردن آن تجربه مرور را کاهش می‌دهد. اما اگر
      می‌خواهید نهایت سخت‌گیری را داشته باشید، سطح حمله را کم می‌کند.
  softwareLinks:
    - title: مرورگرهای حریم‌خصوصی
      url: https://awesome-privacy.xyz#browsers
    - title: موتورهای جست‌وجو
      url: https://awesome-privacy.xyz#search-engines
    - title: افزونه‌های مرورگر
      url: https://awesome-privacy.xyz#browser-extensions
    - title: همگام‌سازی مرورگر و بوکمارک
      url: https://awesome-privacy.xyz#browser-sync
  color: emerald

- title: ایمیل
  slug: email
  description: حفاظت از دروازه ورود به حساب‌های آنلاین
  icon: email
  intro: >-
    نزدیک به ۵۰ سال از اولین ایمیل گذشته و هنوز بخش بزرگی از زندگی روزمره ماست و در آینده نزدیک هم همین‌طور خواهد بود.
    با توجه به میزان اعتمادی که به ایمیل داریم، تعجب‌آور است که این زیرساخت تا چه حد ذاتا ناامن است. کلاهبرداری‌های مرتبط
    با ایمیل [در حال افزایش‌اند](https://www.csoonline.com/article/3247670/email/email-security-in-2018.html) و بدون اقدامات
    پایه‌ای ممکن است در خطر باشید.
    

    اگر مهاجمی به ایمیل شما دسترسی پیدا کند، می‌تواند از آن به عنوان دروازه ورود برای نفوذ به دیگر حساب‌ها (از طریق
    بازیابی گذرواژه) استفاده کند؛ بنابراین امنیت ایمیل برای امنیت دیجیتال شما حیاتی است.


    شرکت‌های بزرگی که ایمیل «رایگان» ارائه می‌دهند، سابقه خوبی در احترام به حریم خصوصی ندارند: Gmail متهم شد که
    [دسترسی کامل](https://www.wsj.com/articles/techs-dirty-secret-the-app-developers-sifting-through-your-gmail-1530544442)
    به ایمیل کاربران را به اشخاص ثالث داده و همچنین [خریدهای شما را ردیابی](https://www.cnbc.com/2019/05/17/google-gmail-tracks-purchase-history-how-to-delete-it.html) کرده است.
    Yahoo نیز به اسکن بلادرنگ ایمیل‌ها [برای نهادهای نظارتی آمریکا](http://news.trust.org/item/20161004170601-99f8c) متهم شد.
    همچنین به تبلیغ‌کنندگان [دسترسی](https://thenextweb.com/insider/2018/08/29/both-yahoo-and-aol-are-scanning-customer-emails-to-attract-advertisers)
    داده شد تا پیام‌ها را برای «شناسایی و بخش‌بندی مشتریان بالقوه بر اساس سیگنال‌های خرید و خریدهای گذشته» تحلیل کنند.

  checklist:
  - point: بیش از یک آدرس ایمیل داشته باشید
    priority: Essential
    details: >-
      برای ارتباطات حساس یک ایمیل جدا از ایمیل‌های کم‌اهمیت مثل خبرنامه‌ها استفاده کنید. این جداسازی آسیب ناشی از
      نشت داده را کاهش می‌دهد و بازیابی حساب آسیب‌دیده را آسان‌تر می‌کند.

  - point: آدرس ایمیل را خصوصی نگه دارید
    priority: Essential
    details: >-
      ایمیل اصلی خود را عمومی منتشر نکنید، زیرا آدرس ایمیل اغلب نقطه شروع حملات فیشینگ است.

  - point: حساب خود را امن نگه دارید
    priority: Essential
    details: >-
      از گذرواژه طولانی و یکتا استفاده کنید، 2FA را فعال کنید و هنگام ورود دقت داشته باشید. حساب ایمیل یک مسیر آسان
      برای دسترسی مهاجم به سایر حساب‌های شماست.

  - point: بارگذاری خودکار محتوای راه‌دور را غیرفعال کنید
    priority: Essential
    details: >-
      ایمیل‌ها می‌توانند محتوای راه‌دور مثل تصویر یا استایل داشته باشند که خودکار از سرور بارگذاری می‌شود. این گزینه
      را غیرفعال کنید چون آدرس IP و اطلاعات دستگاه را فاش می‌کند و برای ردیابی به کار می‌رود. برای اطلاعات بیشتر
      [این مقاله](https://www.theverge.com/2019/7/3/20680903/email-pixel-trackers-how-to-stop-images-automatic-download) را ببینید.

  - point: استفاده از متن ساده
    priority: Optional
    details: >-
      دو نوع اصلی ایمیل وجود دارد: متن ساده و HTML. متن ساده از نظر امنیت و حریم خصوصی بهتر است چون ایمیل‌های HTML
      معمولا شامل شناسه‌های پنهان در لینک‌ها و تصاویر هستند که داده جمع می‌کنند. همچنین ریسک اجرای کد از راه دور
      در解析‌گر HTML کلاینت ایمیل وجود دارد که در متن ساده رخ نمی‌دهد. برای اطلاعات بیشتر و راهنمای تنظیمات،
      [UsePlaintext.email](https://useplaintext.email/) را ببینید.

  - point: برنامه‌های شخص ثالث را به حساب ایمیل وصل نکنید
    priority: Optional
    details: >-
      اگر به یک برنامه یا افزونه شخص ثالث دسترسی کامل به صندوق ورودی بدهید، عملا به تمام ایمیل‌ها و محتوای آن‌ها
      دسترسی بدون محدودیت می‌دهید که ریسک جدی امنیتی و حریم خصوصی دارد.

  - point: داده‌های حساس را با ایمیل ارسال نکنید
    priority: Optional
    details: >-
      ایمیل‌ها به‌راحتی قابل رهگیری‌اند و شما از امنیت محیط گیرنده مطمئن نیستید. بنابراین ایمیل برای تبادل اطلاعات
      محرمانه امن نیست مگر اینکه رمزنگاری شده باشد.

  - point: مهاجرت به ارائه‌دهنده ایمیل امن‌تر را در نظر بگیرید
    priority: Optional
    details: >-
      ارائه‌دهندگان امن و معتبر مانند [Forward Email](https://awesome-privacy.xyz/communication/encrypted-email/forward-email)،
      [ProtonMail](https://awesome-privacy.xyz/communication/mail-forwarding/protonmail) و
      [Tutanota](https://awesome-privacy.xyz/communication/encrypted-email/tuta) رمزنگاری سرتاسری، حریم خصوصی کامل
      و قابلیت‌های امنیتی بیشتری ارائه می‌دهند. برخلاف سرویس‌های معمولی، صندوق ایمیل شما توسط دیگران قابل خواندن نیست
      چون پیام‌ها رمزنگاری شده‌اند.

  - point: استفاده از کلید هوشمند
    priority: Advanced
    details: >-
      OpenPGP از Forward Secrecy پشتیبانی نمی‌کند؛ یعنی اگر کلید خصوصی شما یا گیرنده دزدیده شود، همه پیام‌های گذشته
      رمزنگاری‌شده لو می‌روند. بنابراین باید از کلید خصوصی به‌خوبی محافظت کنید. یک روش این است که از کلید هوشمند USB
      برای امضا یا رمزگشایی استفاده کنید تا کلید خصوصی از دستگاه خارج نشود.

  - point: استفاده از نام مستعار / فوروارد ناشناس
    priority: Advanced
    details: >-
      نام مستعار ایمیل اجازه می‌دهد پیام‌ها به [anything]@my-domain.com ارسال شوند و به صندوق اصلی برسند. این یعنی
      می‌توانید برای هر سرویس یک ایمیل یکتا داشته باشید. اگر اسپم دریافت کردید، می‌توانید آن نام مستعار را مسدود و
      منبع نشت را شناسایی کنید.

  - point: زیرآدرس‌گذاری
    priority: Optional
    details: >-
      جایگزین نام مستعار، زیرآدرس‌گذاری است که در آن هر چیزی بعد از `+` هنگام تحویل حذف می‌شود. این کار به شما کمک
      می‌کند بفهمید چه کسی ایمیل شما را به اشتراک گذاشته یا لو داده است، اما مانند نام مستعار از آدرس واقعی شما محافظت نمی‌کند.

  - point: استفاده از دامنه سفارشی
    priority: Advanced
    details: >-
      استفاده از دامنه اختصاصی یعنی وابسته به آدرس ارائه‌شده توسط سرویس‌دهنده نیستید. بنابراین در آینده می‌توانید
      به‌راحتی ارائه‌دهنده را تغییر دهید و نگران قطع سرویس نباشید.

  - point: همگام‌سازی با کلاینت برای پشتیبان‌گیری
    priority: Advanced
    details: >-
      برای جلوگیری از از دست رفتن دسترسی به ایمیل‌ها در رویدادهای پیش‌بینی‌نشده (مثل قطعی یا قفل شدن حساب)،
      Thunderbird می‌تواند پیام‌ها را از چند حساب از طریق IMAP همگام/پشتیبان‌گیری کرده و محلی ذخیره کند.

  - point: درباره امضای ایمیل محتاط باشید
    priority: Advanced
    details: >-
      شما نمی‌دانید محیط ایمیل گیرنده چقدر امن است. افزونه‌هایی وجود دارند که پیام‌ها را خودکار می‌خوانند و بر اساس
      امضاها پایگاه داده‌ای از اطلاعات تماس می‌سازند.

  - point: درباره پاسخ خودکار محتاط باشید
    priority: Advanced
    details: >-
      پاسخ خودکار خارج از دفتر مفید است اما اغلب اطلاعات زیادی افشا می‌کند که برای مهندسی اجتماعی و حملات هدفمند به کار می‌رود.

  - point: پروتکل ایمیل مناسب را انتخاب کنید
    priority: Advanced
    details: >-
      از پروتکل‌های قدیمی (کمتر از IMAPv4 یا POPv3) استفاده نکنید؛ این‌ها آسیب‌پذیری‌های شناخته‌شده و امنیت قدیمی دارند.

  - point: میزبانی شخصی
    priority: Advanced
    details: >-
      میزبانی ایمیل شخصی برای کاربران غیرپیشرفته توصیه نمی‌شود، چون امن‌سازی درست آن حیاتی و نیازمند دانش شبکه قوی است.

  - point: همیشه از پورت‌های TLS استفاده کنید
    priority: Advanced
    details: >-
      برای POP3، IMAP و SMTP گزینه‌های SSL روی پورت‌های استاندارد TCP/IP وجود دارد. استفاده از آن‌ها ساده و پشتیبانی گسترده است،
      بنابراین همیشه به‌جای پورت‌های متن ساده از آن‌ها استفاده کنید.

  - point: دسترس‌پذیری DNS
    priority: Advanced
    details: >-
      برای سرورهای ایمیل خودمیزبان، جهت جلوگیری از تاثیر مشکلات DNS بر دسترس‌پذیری، حداقل دو رکورد MX داشته باشید و
      برای افزونگی از رکوردهای ثانویه و ثالث استفاده کنید.

  - point: جلوگیری از حملات DDoS و جست‌وجوی فراگیر
    priority: Advanced
    details: >-
      برای سرورهای ایمیل خودمیزبان (به‌ویژه SMTP)، تعداد اتصالات هم‌زمان و نرخ اتصال را محدود کنید تا اثر حملات بات کاهش یابد.

  - point: نگه‌داری فهرست سیاه IP
    priority: Advanced
    details: >-
      برای سرورهای ایمیل خودمیزبان، با نگه‌داشتن فهرست سیاه محلی IP و فهرست مسدودسازی بلادرنگ URIهای اسپم می‌توانید
      فیلتر اسپم را بهبود داده و لینک‌های مخرب را حذف کنید.
  color: teal
  softwareLinks:
