- title: جنبه انسانی
  slug: human-aspect
  description: پرهیز از ریسک‌های مهندسی اجتماعی
  icon: human
  intro: >-
    بسیاری از نشت‌های داده، هک‌ها و حملات به‌دلیل خطای انسانی رخ می‌دهند.
    فهرست زیر گام‌هایی است برای کاهش این ریسک. بسیاری از آن‌ها بدیهی‌اند، اما ارزش یادآوری دارند.

  checklist:
  - point: گیرندگان را تایید کنید
    priority: Essential
    details: >-
      ایمیل‌ها به‌راحتی قابل جعل هستند. به‌ویژه برای اقدامات حساس، اصالت فرستنده را بررسی کنید و به‌جای کلیک روی لینک‌ها،
      URL را دستی وارد کنید.

  - point: به اعلان‌های پاپ‌آپ اعتماد نکنید
    priority: Essential
    details: >-
      پاپ‌آپ‌های جعلی می‌توانند توسط مهاجمان ایجاد شوند. قبل از وارد کردن اطلاعات، URL را بررسی کنید.

  - point: دستگاه را بدون مراقبت رها نکنید
    priority: Essential
    details: >-
      دستگاه‌های بدون مراقبت حتی با گذرواژه قوی هم می‌توانند به خطر بیفتند. از رمزنگاری و قابلیت پاک‌سازی از راه دور
      مثل Find My Phone برای دستگاه‌های گم‌شده استفاده کنید.

  - point: از Camfecting جلوگیری کنید
    priority: Essential
    details: >-
      با پوشاندن وب‌کم و مسدودکننده میکروفون از Camfecting جلوگیری کنید. هنگام عدم استفاده یا گفتگوهای حساس، دستیارهای صوتی
      را بی‌صدا کنید.

  - point: در برابر نگاه از روی شانه محافظت شوید
    priority: Essential
    details: >-
      از فیلتر حریم خصوصی روی لپ‌تاپ و موبایل در مکان‌های عمومی استفاده کنید تا دیگران صفحه را نبینند.

  - point: درباره حملات فیشینگ آموزش ببینید
    priority: Essential
    details: >-
      نسبت به فیشینگ محتاط باشید. URL و زمینه پیام را بررسی کنید و از روش‌های امن مثل 2FA و عدم استفاده مجدد از گذرواژه بهره ببرید.

  - point: مراقب استاکروِر باشید
    priority: Essential
    details: >-
      از نصب استاکروِر توسط افراد آشنا برای جاسوسی آگاه باشید. نشانه‌هایی مثل مصرف غیرعادی باتری را بررسی کنید و در صورت
      شک، تنظیمات کارخانه را بازگردانید.

  - point: نرم‌افزار معتبر را از منابع مطمئن نصب کنید
    priority: Essential
    details: >-
      نرم‌افزار را فقط از منابع معتبر دانلود کنید و قبل از نصب با ابزارهایی مثل
      [Virus Total](https://awesome-privacy.xyz/security-tools/online-tools/virus-total) بررسی کنید.

  - point: داده‌های شخصی را امن نگه‌داری کنید
    priority: Essential
    details: >-
      مطمئن شوید همه داده‌های شخصی روی دستگاه یا در فضای ابری رمزنگاری شده‌اند تا دسترسی غیرمجاز ممکن نباشد.

  - point: جزئیات شخصی را از اسناد پنهان کنید
    priority: Essential
    details: >-
      هنگام اشتراک‌گذاری اسناد، جزئیات شخصی را با مربع‌های پوشاننده پنهان کنید تا نشت اطلاعات رخ ندهد.

  - point: فقط به دلیل HTTPS بودن، امن بودن سایت را فرض نکنید
    priority: Essential
    details: >-
      HTTPS تضمین‌کننده اعتبار سایت نیست. URL را بررسی کنید و در مورد داده‌های شخصی محتاط باشید.

  - point: برای پرداخت آنلاین از کارت مجازی استفاده کنید
    priority: Optional
    details: >-
      با کارت مجازی پرداخت کنید تا اطلاعات بانکی محافظت و ریسک تراکنش محدود شود.

  - point: مجوزهای برنامه‌ها را بازبینی کنید
    priority: Optional
    details: >-
      به‌طور منظم مجوزهای برنامه‌ها را بررسی و مدیریت کنید تا دسترسی غیرضروری وجود نداشته باشد.

  - point: از فهرست‌های عمومی خارج شوید
    priority: Optional
    details: >-
      از پایگاه‌های داده عمومی و فهرست‌های بازاریابی خارج شوید تا تماس‌های ناخواسته و ریسک‌ها کاهش یابد.

  - point: هنگام انصراف، اطلاعات هویتی اضافه ندهید
    priority: Optional
    details: >-
      هنگام لغو عضویت از سرویس‌های داده، اطلاعات شخصی اضافه ندهید تا جمع‌آوری بیشتر رخ ندهد.

  - point: از اشتراک‌گذاری داده انصراف دهید
    priority: Optional
    details: >-
      بسیاری از برنامه‌ها و سرویس‌ها به‌صورت پیش‌فرض داده را به اشتراک می‌گذارند. این گزینه را غیرفعال کنید تا داده با اشخاص ثالث
      به اشتراک گذاشته نشود.

  - point: حریم خصوصی شبکه‌های اجتماعی را بازبینی کنید
    priority: Optional
    details: >-
      به‌دلیل تغییرات مکرر شرایط خدمات، تنظیمات حریم خصوصی شبکه‌های اجتماعی را مرتب بررسی و به‌روز کنید.

  - point: جداسازی را رعایت کنید
    priority: Advanced
    details: >-
      حوزه‌های مختلف فعالیت دیجیتال را جدا نگه دارید تا در صورت نشت، افشا محدود شود.

  - point: از محافظ حریم خصوصی WhoIs استفاده کنید
    priority: Advanced
    details: >-
      برای ثبت دامنه از WhoIs Privacy Guard استفاده کنید تا اطلاعات شخصی از جست‌وجوی عمومی محافظت شود.

  - point: از آدرس پستی واسط استفاده کنید
    priority: Advanced
    details: >-
      از صندوق پستی یا آدرس فوروارد برای نامه‌ها استفاده کنید تا شرکت‌ها آدرس واقعی شما را ندانند.

  - point: از روش‌های پرداخت ناشناس استفاده کنید
    priority: Advanced
    details: >-
      از روش‌های پرداخت ناشناس مثل رمزارزها استفاده کنید تا اطلاعات قابل شناسایی آنلاین وارد نشود.

  color: indigo

- title: امنیت فیزیکی
  slug: physical-security
  description: اقداماتی برای جلوگیری از رخدادهای امنیتی در دنیای واقعی
  icon: physical
  intro: >-
    سوابق عمومی اغلب شامل داده‌های شخصی حساس هستند (نام کامل، تاریخ تولد، شماره تلفن، ایمیل، نشانی، قومیت و ...)،
    و از منابع مختلف جمع‌آوری می‌شوند (سرشماری، گواهی تولد/مرگ/ازدواج، ثبت‌نام رأی‌دهندگان، اطلاعات بازاریابی،
    پایگاه‌های مشتریان، سوابق خودرو، مجوزهای حرفه‌ای/کسب‌وکار و پرونده‌های دادگاه با جزئیات کامل). این اطلاعات
    [به‌سادگی و قانونی قابل دسترسی است](https://www.consumerreports.org/consumerist/its-creepy-but-not-illegal-for-this-website-to-provide-all-your-public-info-to-anyone/)،
    که [نگرانی‌های جدی حریم خصوصی](https://privacyrights.org/resources/public-records-internet-privacy-dilemma)
    ایجاد می‌کند (سرقت هویت، خطرات ایمنی شخصی/مزاحمان، تخریب اعتبار، جامعه پرونده‌ای).


    CCTV یکی از راه‌های اصلی ردیابی حرکت شما توسط شرکت‌ها، افراد و دولت است. در لندن، به‌طور متوسط هر نفر
    حدود ۵۰۰ بار در روز جلوی دوربین قرار می‌گیرد. این شبکه رو به گسترش است و در بسیاری از شهرها تشخیص چهره
    در حال اجراست؛ یعنی دولت می‌تواند هویت افراد را در تصاویر به‌صورت لحظه‌ای بداند.

    احراز هویت قوی، دستگاه‌های رمزنگاری‌شده، نرم‌افزارهای وصله‌شده و مرور ناشناس اگر کسی بتواند شما، دستگاه‌ها
    و داده‌هایتان را فیزیکی به خطر بیندازد، چندان مفید نیستند. این بخش روش‌های پایه امنیت فیزیکی را ارائه می‌کند.

  checklist:
  - point: اسناد حساس را از بین ببرید
    priority: Essential
    details: |
      اسناد حساس را قبل از دور انداختن خرد یا بخش‌های حساس را پوشش دهید تا از سرقت هویت جلوگیری شود.

  - point: از سوابق عمومی خارج شوید
    priority: Essential
    details: |
      با وب‌سایت‌های جست‌وجوی افراد تماس بگیرید تا از فهرست‌هایی که اطلاعات شخصی نمایش می‌دهند خارج شوید
      (با راهنماهایی مانند دفترچه حذف داده‌های شخصی مایکل بازِل).

  - point: اسناد را واترمارک کنید
    priority: Essential
    details: |
      روی نسخه دیجیتال اسناد شخصی، واترمارک شامل نام گیرنده و تاریخ بزنید تا منبع نشت قابل ردیابی باشد.

  - point: در تماس‌های ورودی اطلاعات افشا نکنید
    priority: Essential
    details: |
      اطلاعات شخصی را فقط در تماس‌هایی که خودتان برقرار می‌کنید بدهید و شماره گیرنده را تایید کنید.

  - point: هوشیار باشید
    priority: Essential
    details: محیط اطراف را زیر نظر داشته باشید و ریسک‌های احتمالی در محیط‌های جدید را بسنجید.

  - point: محیط پیرامون را ایمن کنید
    priority: Essential
    details: امنیت فیزیکی محل نگه‌داری دستگاه‌ها و اطلاعات شخصی را تضمین کنید، دسترسی بیرونی را محدود و از سامانه‌های تشخیص نفوذ استفاده کنید.

  - point: دستگاه‌ها را فیزیکی ایمن کنید
    priority: Essential
    details: از ابزارهای فیزیکی مثل قفل Kensington، پوش وب‌کم و فیلتر حریم خصوصی صفحه استفاده کنید.

  - point: دستگاه‌ها را در دید مستقیم قرار ندهید
    priority: Essential
    details: دستگاه‌ها را از دید بیرونی پنهان کنید تا ریسک لیزر و سرقت کاهش یابد.

  - point: از PIN خود محافظت کنید
    priority: Essential
    details: هنگام وارد کردن PIN آن را از دید دوربین و افراد پنهان کنید و پس از استفاده صفحه لمسی را تمیز کنید.

  - point: دستگاه‌های اسکیمر را بررسی کنید
    priority: Essential
    details: قبل از استفاده از خودپرداز یا دستگاه عمومی، علائم دست‌کاری و اسکیمر را بررسی کنید.

  - point: از آدرس خانه محافظت کنید
    priority: Optional
    details: از آدرس‌های جایگزین، فورواردینگ و روش‌های پرداخت ناشناس استفاده کنید تا آدرس خانه پنهان بماند.

  - point: از PIN به‌جای بیومتریک استفاده کنید
    priority: Advanced
    details: در موقعیت‌هایی که اجبار قانونی برای باز کردن دستگاه ممکن است رخ دهد، PIN را به بیومتریک ترجیح دهید.

  - point: مواجهه با CCTV را کاهش دهید
    priority: Advanced
    details: برای دوری از نظارت، مسیرهایی با دوربین کمتر انتخاب کنید و در صورت نیاز پوشش مناسب بپوشید.

  - point: پوشاک ضد تشخیص چهره
    priority: Advanced
    details: از لباس‌هایی با الگوهای فریب‌دهنده برای سامانه‌های تشخیص چهره استفاده کنید.

  - point: مواجهه با دید در شب را کاهش دهید
    priority: Advanced
    details: از منابع نور IR یا عینک‌های بازتابنده برای مختل کردن دوربین‌های دید در شب استفاده کنید.

  - point: از DNA خود محافظت کنید
    priority: Advanced
    details: از اشتراک DNA با سایت‌های شجره‌نامه پرهیز کنید و نسبت به باقی گذاشتن رد DNA محتاط باشید.

  color: lime
