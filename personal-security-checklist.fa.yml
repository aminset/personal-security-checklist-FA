- title: رایانه‌های شخصی
  slug: personal-computers
  description: امن‌سازی سیستم‌عامل، داده و فعالیت رایانه
  icon: computer
  intro: >
    با اینکه Windows و OS X راحت و کاربرپسند هستند، هر دو از نظر امنیتی آسیب‌پذیرند.
    سیستم‌عامل رابط بین سخت‌افزار و برنامه‌های شماست و اگر به خطر بیفتد می‌تواند آسیب جدی ایجاد کند.
  checklist:
  - point: سیستم را به‌روز نگه دارید
    priority: Essential
    details: >-
      به‌روزرسانی‌های سیستم‌عامل شامل وصله‌های امنیتی، بهبود عملکرد و گاهی ویژگی‌های جدید هستند. وقتی اعلان آمد نصب کنید.

  - point: دستگاه را رمزنگاری کنید
    priority: Essential
    details: >-
      برای رمزنگاری کامل دیسک از BitLocker در Windows، FileVault در MacOS یا LUKS در Linux استفاده کنید. این کار
      در صورت گم شدن یا سرقت دستگاه مانع دسترسی غیرمجاز می‌شود.

  - point: از داده‌های مهم پشتیبان بگیرید
    priority: Essential
    details: >-
      پشتیبان‌گیری رمزنگاری‌شده از از دست رفتن داده‌ها در برابر باج‌افزار، سرقت یا آسیب جلوگیری می‌کند. برای فایل‌های
      ابری از [Cryptomator](https://awesome-privacy.xyz/security-tools/mobile-apps/cryptomator) و برای درایوهای USB
      از [VeraCrypt](https://awesome-privacy.xyz/essentials/file-encryption/veracrypt) استفاده کنید.

  - point: هنگام اتصال USB محتاط باشید
    priority: Essential
    details: >-
      دستگاه‌های USB می‌توانند تهدید جدی باشند. می‌توانید با CIRCLean یک USB Sanitizer بسازید تا دستگاه‌های USB را امن بررسی کنید.

  - point: قفل صفحه را هنگام بیکاری فعال کنید
    priority: Essential
    details: >-
      هنگام ترک سیستم آن را قفل کنید و تنظیم کنید که پس از اسکرین‌سیور یا خواب، گذرواژه بخواهد.

  - point: Cortana یا Siri را غیرفعال کنید
    priority: Essential
    details: >-
      دستیارهای صوتی به دلیل ارسال داده برای پردازش، خطرات حریم خصوصی دارند. آن‌ها را غیرفعال یا محدود کنید.

  - point: برنامه‌های نصب‌شده را بازبینی کنید
    priority: Essential
    details: >-
      تعداد برنامه‌های نصب‌شده را به حداقل برسانید و کش برنامه‌ها را به‌طور منظم پاک کنید تا سطح آسیب کاهش یابد.

  - point: مدیریت مجوزها
    priority: Essential
    details: >-
      مشخص کنید کدام برنامه‌ها به موقعیت، دوربین، میکروفون، مخاطبین و داده‌های حساس دسترسی دارند.

  - point: ارسال داده‌های استفاده به فضای ابری را محدود کنید
    priority: Essential
    details: >-
      میزان اطلاعات استفاده یا بازخوردی که به ابر ارسال می‌شود را محدود کنید تا حریم خصوصی حفظ شود.

  - point: از بازگشایی سریع پرهیز کنید
    priority: Essential
    details: >-
      برای باز کردن رایانه از گذرواژه قوی به‌جای بیومتریک یا PIN کوتاه استفاده کنید.

  - point: رایانه را خاموش کنید، نه در حالت آماده‌به‌کار
    priority: Essential
    details: >-
      وقتی از دستگاه استفاده نمی‌کنید آن را خاموش کنید، به‌خصوص اگر دیسک رمزنگاری شده است.

  - point: رایانه را به حساب Microsoft یا Apple وصل نکنید
    priority: Optional
    details: >-
      از حساب محلی استفاده کنید تا از همگام‌سازی و افشای داده جلوگیری شود. از سرویس‌های همگام‌سازی آسیب‌زا اجتناب کنید.

  - point: بررسی کنید کدام سرویس‌های اشتراک‌گذاری فعال‌اند
    priority: Optional
    details: >-
      قابلیت‌های اشتراک‌گذاری شبکه‌ای که استفاده نمی‌کنید را غیرفعال کنید.

  - point: برای کارهای روزمره از حساب Root/Admin استفاده نکنید
    priority: Optional
    details: >-
      از حساب کاربری محدود برای کارهای روزمره استفاده کنید و فقط در صورت نیاز مجوز مدیریتی بدهید.

  - point: وب‌کم و میکروفون را مسدود کنید
    priority: Optional
    details: >-
      وقتی وب‌کم استفاده نمی‌شود آن را بپوشانید و ضبط صوت غیرمجاز را مسدود کنید.

  - point: از فیلتر حریم خصوصی استفاده کنید
    priority: Optional
    details: >-
      در مکان‌های عمومی از فیلتر حریم خصوصی صفحه استفاده کنید تا جلوی دید از روی شانه گرفته شود.

  - point: امنیت فیزیکی دستگاه
    priority: Optional
    details: >-
      از قفل Kensington برای لپ‌تاپ در مکان‌های عمومی استفاده کنید و در صورت نیاز قفل پورت‌ها را برای جلوگیری از دسترسی فیزیکی در نظر بگیرید.

  - point: دستگاه‌ها را از رایانه شارژ نکنید
    priority: Optional
    details: >-
      به‌جای شارژ از رایانه، از پاوربانک یا شارژر دیواری استفاده کنید تا ریسک امنیتی USB کاهش یابد.

  - point: آدرس سخت‌افزاری را در وای‌فای تصادفی کنید
    priority: Optional
    details: >-
      آدرس MAC را تغییر یا تصادفی کنید تا از ردیابی بین شبکه‌های مختلف جلوگیری شود.

  - point: از فایروال استفاده کنید
    priority: Optional
    details: >-
      یک فایروال نصب کنید تا دسترسی اینترنتی ناخواسته برخی برنامه‌ها را مسدود کرده و از حملات دسترسی از راه دور جلوگیری کند.

  - point: در برابر کی‌لاگرهای نرم‌افزاری محافظت کنید
    priority: Optional
    details: >-
      از ابزارهای رمزنگاری ضربه‌کلید برای جلوگیری از ثبت کلیدها توسط کی‌لاگرهای نرم‌افزاری استفاده کنید.

  - point: اتصال کیبورد را بررسی کنید
    priority: Optional
    details: >-
      هنگام استفاده از سیستم‌های عمومی یا ناشناس، اتصال کیبورد را برای وجود کی‌لاگر سخت‌افزاری بررسی کنید.

  - point: از حملات تزریق ضربه‌کلید جلوگیری کنید
    priority: Optional
    details: >-
      هنگام ترک سیستم آن را قفل کنید و از USBGuard یا ابزار مشابه برای جلوگیری از تزریق ضربه‌کلید استفاده کنید.

  - point: از آنتی‌ویروس‌های «رایگان» تجاری استفاده نکنید
    priority: Optional
    details: >-
      به ابزارهای امنیتی داخلی اتکا کنید و از آنتی‌ویروس‌های رایگان تجاری که ممکن است داده جمع کنند پرهیز کنید.

  - point: به‌صورت دوره‌ای روت‌کیت را بررسی کنید
    priority: Advanced
    details: >-
      با ابزارهایی مثل [chkrootkit](https://awesome-privacy.xyz/operating-systems/linux-defenses/chkrootkit) به‌طور منظم
      روت‌کیت‌ها را بررسی کنید.

  - point: گذرواژه بوت BIOS
    priority: Advanced
    details: >-
      برای افزایش امنیت هنگام بوت، گذرواژه BIOS/UEFI فعال کنید، هرچند محدودیت‌های آن را در نظر داشته باشید.

  - point: از سیستم‌عامل امنیت‌محور استفاده کنید
    priority: Advanced
    details: >-
      برای حریم خصوصی و امنیت بیشتر، به Linux یا توزیع امنیت‌محوری مثل QubeOS یا
      [Tails](https://awesome-privacy.xyz/operating-systems/desktop-operating-systems/tails) مهاجرت کنید.

  - point: از ماشین‌های مجازی استفاده کنید
    priority: Advanced
    details: >-
      برای فعالیت‌های پرخطر یا آزمایش نرم‌افزار مشکوک از VM استفاده کنید تا تهدیدها از سیستم اصلی جدا شوند.

  - point: جداسازی را رعایت کنید
    priority: Advanced
    details: >-
      برنامه‌ها و منابع داده را تا حد ممکن از هم جدا کنید تا دامنه نفوذ محدود شود.

  - point: قابلیت‌های ناخواسته را در Windows غیرفعال کنید
    priority: Advanced
    details: >-
      قابلیت‌ها و سرویس‌های غیرضروری Windows را غیرفعال کنید تا جمع‌آوری داده و مصرف منابع کاهش یابد.

  - point: بوت امن (Secure Boot)
    priority: Advanced
    details: >-
      مطمئن شوید Secure Boot فعال است تا بدافزار نتواند بوت‌لودر و نرم‌افزارهای حیاتی را جایگزین کند.

  - point: دسترسی SSH را ایمن کنید
    priority: Advanced
    details: >-
      با تغییر پورت پیش‌فرض، استفاده از کلیدهای SSH و تنظیم فایروال دسترسی SSH را امن کنید.

  - point: پورت‌های بازِ بلااستفاده را ببندید
    priority: Advanced
    details: >-
      سرویس‌هایی که روی پورت‌های بیرونی گوش می‌دهند و لازم نیستند را خاموش کنید تا امنیت افزایش یابد.

  - point: کنترل دسترسی اجباری پیاده‌سازی کنید
    priority: Advanced
    details: >-
      دسترسی‌های سطح بالا را محدود کنید تا در صورت نفوذ، خسارت کاهش یابد.

  - point: از Canary Token استفاده کنید
    priority: Advanced
    details: >-
      برای تشخیص سریع‌تر دسترسی غیرمجاز به فایل‌ها یا ایمیل‌ها، Canary Tokenها را مستقر کنید و اطلاعاتی درباره مهاجم جمع‌آوری کنید.
