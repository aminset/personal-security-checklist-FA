- title: خانه هوشمند
  slug: smart-home
  description: استفاده از دستگاه‌های IoT بدون آسیب به حریم خصوصی
  icon: home
  intro: >-
    دستیارهای خانگی (مثل Google Home، Alexa و Siri) و سایر دستگاه‌های متصل به اینترنت حجم زیادی از داده‌های شخصی
    جمع‌آوری می‌کنند (از جمله نمونه‌های صوتی، داده مکانی، جزئیات خانه و لاگ همه تعاملات). چون کنترل محدودی بر اینکه
    چه چیزی جمع‌آوری می‌شود، چگونه ذخیره می‌شود و برای چه استفاده می‌شود دارید، توصیه محصولات خانه هوشمند مصرفی برای
    کسانی که به حریم خصوصی و امنیت اهمیت می‌دهند دشوار است.

    امنیت در برابر حریم خصوصی: دستگاه‌های هوشمند زیادی در بازار هستند که ادعا می‌کنند امنیت خانه را بالا می‌برند و
    در عین حال استفاده آسانی دارند (مثل دزدگیر هوشمند، دوربین امنیتی اینترنتی، قفل هوشمند و زنگ در با دسترسی از راه دور).
    این دستگاه‌ها ممکن است امنیت را ساده‌تر کنند، اما بهای آن حریم خصوصی است: آن‌ها داده‌های زیادی جمع می‌کنند و
    کنترل شما بر نحوه ذخیره و استفاده را کم می‌کنند. امنیت این دستگاه‌ها نیز زیر سوال است، چون بسیاری از آن‌ها هک
    می‌شوند و مهاجم می‌تواند با کمترین تلاش از شناسایی عبور کند.

    محترمانه‌ترین گزینه نسبت به حریم خصوصی این است که از دستگاه‌های «هوشمند» متصل به اینترنت در خانه استفاده نکنید
    و به ابزار امنیتی وابسته به اینترنت تکیه نکنید. اما اگر استفاده می‌کنید، پیش از خرید باید ریسک‌های محصول را
    کامل بشناسید و سپس تنظیمات را برای افزایش حریم خصوصی و امنیت اصلاح کنید. چک‌لیست زیر به کاهش ریسک‌های مرتبط با
    دستگاه‌های خانگی متصل به اینترنت کمک می‌کند.
  checklist:
  - point: نام دستگاه‌ها را طوری تغییر دهید که برند/مدل مشخص نشود
    priority: Essential
    details: >-
      نام پیش‌فرض دستگاه‌ها را به نامی عمومی تغییر دهید تا با پنهان کردن برند/مدل از حملات هدفمند جلوگیری شود.

  - point: میکروفون و دوربین را هنگام عدم استفاده خاموش کنید
    priority: Essential
    details: >-
      از کلیدهای سخت‌افزاری برای خاموش کردن میکروفون و دوربین دستگاه‌های هوشمند استفاده کنید تا جلوی ضبط ناخواسته یا
      دسترسی هدفمند گرفته شود.

  - point: بدانید چه داده‌ای جمع‌آوری، ذخیره و منتقل می‌شود
    priority: Essential
    details: >-
      پیش از خرید، شیوه‌های مدیریت داده در دستگاه‌های خانه هوشمند را بررسی کنید و از دستگاه‌هایی که داده را با اشخاص
      ثالث به اشتراک می‌گذارند اجتناب کنید.

  - point: تنظیمات حریم خصوصی را سخت‌گیرانه کنید و اشتراک داده با اشخاص ثالث را غیرفعال کنید
    priority: Essential
    details: >-
      تنظیمات برنامه را روی سخت‌گیرانه‌ترین حالت حریم خصوصی بگذارید و تا جای ممکن اشتراک داده با اشخاص ثالث را خاموش کنید.

  - point: دستگاه‌های خانه هوشمند را به هویت واقعی خود متصل نکنید
    priority: Essential
    details: >-
      برای حفظ حریم خصوصی از نام کاربری و گذرواژه ناشناس استفاده کنید و از ثبت‌نام/ورود با شبکه‌های اجتماعی یا سرویس‌های
      ثالث پرهیز کنید.

  - point: فریم‌ور را به‌روز نگه دارید
    priority: Essential
    details: >-
      فریم‌ور دستگاه‌های هوشمند را مرتب به‌روز کنید تا وصله‌های امنیتی اعمال شود.

  - point: از شبکه خود محافظت کنید
    priority: Essential
    details: >-
      وای‌فای و شبکه خانگی را ایمن کنید تا از دسترسی غیرمجاز به دستگاه‌های هوشمند جلوگیری شود.

  - point: درباره پوشیدنی‌ها محتاط باشید
    priority: Optional
    details: >-
      قابلیت‌های گسترده جمع‌آوری داده در دستگاه‌های پوشیدنی و پیامدهای حریم خصوصی آن را در نظر بگیرید.

  - point: زیرساخت حیاتی خانه را به اینترنت وصل نکنید
    priority: Optional
    details: >-
      ریسک ترموستات‌ها، دزدگیرها و حسگرهای متصل به اینترنت را به دلیل امکان دسترسی از راه دور ارزیابی کنید.

  - point: ریسک‌های Alexa/Google Home را کاهش دهید
    priority: Optional
    details: >-
      از جایگزین‌های حریم‌خصوصی‌محور مانند
      [Mycroft](https://awesome-privacy.xyz/smart-home-and-iot/voice-assistants/mycroft) استفاده کنید یا Project Alias
      را برای جلوگیری از شنود همیشه‌فعال فعال کنید.

  - point: شبکه خانگی را با دقت پایش کنید
    priority: Optional
    details: >-
      از ابزارهایی مثل FingBox یا امکانات روتر برای پایش فعالیت غیرعادی شبکه استفاده کنید.

  - point: در صورت امکان دسترسی اینترنت را قطع کنید
    priority: Advanced
    details: >-
      با فایروال دسترسی اینترنت دستگاه‌هایی که نیاز ندارند را مسدود کنید و آن‌ها را محدود به شبکه محلی نگه دارید.

  - point: ریسک‌ها را ارزیابی کنید
    priority: Advanced
    details: >-
      پیامدهای حریم خصوصی برای همه اعضای خانه را در نظر بگیرید و تنظیمات را مطابق نیاز تنظیم کنید؛ مثل خاموش کردن دستگاه‌ها در زمان‌های خاص.
  color: red
  softwareLinks:
  - title: خودکارسازی خانه
    url: https://awesome-privacy.xyz#home-automation
  - title: دستیارهای صوتی هوش مصنوعی
    url: https://awesome-privacy.xyz#ai-voice-assistants

- title: امور مالی شخصی
  slug: personal-finance
  description: حفاظت از دارایی، حساب‌های مالی و تراکنش‌ها
  icon: finance
  intro: >-
    کلاهبرداری کارت اعتباری رایج‌ترین نوع سرقت هویت است (با
    [۱۳۳,۰۱۵ گزارش فقط در آمریکا در سال ۲۰۱۷](https://www.experian.com/blogs/ask-experian/identity-theft-statistics/))
    و مجموع خسارت ۹۰۵ میلیون دلار که نسبت به سال قبل ۲۶٪ افزایش داشت. میانگین خسارت برای هر نفر در ۲۰۱۷ برابر ۴۲۹ دلار بود.
    بیش از همیشه لازم است اقدامات پایه‌ای برای جلوگیری از قربانی شدن انجام دهید.

    نکته درباره کارت‌های اعتباری: کارت‌ها روش‌های فنی برای تشخیص و توقف برخی تراکنش‌های جعلی دارند. پردازشگران بزرگ
    پرداخت این کار را با استخراج حجم زیادی از داده دارندگان کارت انجام می‌دهند تا الگوی خرج هر فرد را بشناسند. این داده‌ها
    برای شناسایی تقلب استفاده می‌شوند، اما به کارگزاران داده هم فروخته می‌شوند. بنابراین کارت اعتباری از نظر امنیت خوب است،
    اما از نظر حریم خصوصی ضعیف.
  checklist:
  - point: فعال‌سازی هشدار تقلب و پایش اعتبار
    priority: Essential
    details: >-
      از طریق Experian، TransUnion یا Equifax هشدار تقلب و پایش اعتبار را فعال کنید تا فعالیت مشکوک را سریع متوجه شوید.

  - point: فریز اعتباری انجام دهید
    priority: Essential
    details: >-
      با فریز اعتبار در Experian، TransUnion و Equifax از استعلام اعتباری غیرمجاز جلوگیری کنید.

  - point: از کارت مجازی استفاده کنید
    priority: Optional
    details: >-
      برای تراکنش‌های آنلاین از شماره کارت مجازی استفاده کنید تا اطلاعات بانکی واقعی محافظت شود. سرویس‌هایی مثل
      [Privacy.com](https://awesome-privacy.xyz/finance/virtual-credit-cards/privacy.com) و
      [MySudo](https://awesome-privacy.xyz/finance/virtual-credit-cards/mysudo) این امکان را می‌دهند.

  - point: برای خریدهای محلی از پول نقد استفاده کنید
    priority: Optional
    details: >-
      برای خریدهای روزمره و محلی از [پول نقد](https://awesome-privacy.xyz/finance/other-payment-methods/cash) استفاده کنید
      تا موسسات نتوانند پروفایل مالی بسازند.

  - point: برای تراکنش‌های آنلاین از رمزارز استفاده کنید
    priority: Optional
    details: >-
      برای حفظ ناشناسی، رمزارزهای حریم‌خصوصی‌محور مثل
      [Monero](https://awesome-privacy.xyz/finance/cryptocurrencies/monero) را برای تراکنش‌های آنلاین انتخاب کنید.
      از رمزارزها با دقت استفاده کنید تا حریم خصوصی حفظ شود.

  - point: رمزارز را امن نگه‌داری کنید
    priority: Advanced
    details: >-
      رمزارزها را با روش‌های امن مثل ساخت کیف پول آفلاین، کیف پول سخت‌افزاری مانند
      [Trezor](https://awesome-privacy.xyz/finance/crypto-wallets/trezor) یا
      [ColdCard](https://awesome-privacy.xyz/finance/crypto-wallets/coldcard) نگه‌داری کنید یا برای نگه‌داری بلندمدت
      از راهکارهایی مثل [CryptoSteel](https://awesome-privacy.xyz/finance/crypto-wallets/cryptosteel) بهره بگیرید.

  - point: رمزارز را ناشناس بخرید
    priority: Advanced
    details: >-
      رمزارزها را بدون اتصال به هویت خود از طریق سرویس‌هایی مانند
      [LocalBitcoins](https://awesome-privacy.xyz/finance/crypto-exchanges/localbitcoins)،
      [Bisq](https://awesome-privacy.xyz/finance/crypto-exchanges/bisq) یا خودپردازهای بیت‌کوین خریداری کنید.

  - point: میکس/تَمبل کردن کوین‌ها
    priority: Advanced
    details: >-
      پیش از تبدیل بیت‌کوین به ارز، از میکسر بیت‌کوین یا CoinJoin استفاده کنید تا رد تراکنش‌ها مبهم شود.

  - point: برای خرید آنلاین از جزئیات مستعار استفاده کنید
    priority: Advanced
    details: >-
      برای خرید آنلاین از جزئیات مستعار، فوروارد ایمیل، شماره VOIP و روش‌های تحویل امن استفاده کنید تا هویت شما حفظ شود.

  - point: از آدرس تحویل جایگزین استفاده کنید
    priority: Advanced
    details: >-
      تحویل به آدرس‌های غیرشخصی مثل صندوق پستی، آدرس فوروارد یا محل‌های دریافت محلی را انتخاب کنید تا خریدها مستقیم به شما متصل نشود.
