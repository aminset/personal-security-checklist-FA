- title: دستگاه‌های موبایل
  slug: mobile-devices
  description: کاهش ردیابی تهاجمی در موبایل و تبلت
  icon: mobile
  intro: >
    گوشی‌های هوشمند بسیاری از جنبه‌های زندگی را متحول کرده‌اند و دنیا را در نوک انگشتان ما گذاشته‌اند. برای بسیاری از ما،
    گوشی هوشمند ابزار اصلی ارتباط، سرگرمی و دسترسی به دانش است. اما با وجود این راحتی، پشت پرده اتفاقات نگران‌کننده‌ای رخ می‌دهد.

    ردیابی مکانی برای دنبال کردن هر حرکت ما به کار می‌رود و کنترل کمی بر این داده‌ها داریم—گوشی شما حتی می‌تواند
    [بدون GPS مکان را ردیابی کند](https://gizmodo.com/how-to-track-a-cellphone-without-gps-or-consent-1821125371).
    گزارش‌های متعدد نشان داده‌اند که چگونه [میکروفون می‌تواند شنود کند](https://www.independent.co.uk/life-style/gadgets-and-tech/news/smartphone-apps-listening-privacy-alphonso-shazam-advertising-pool-3d-honey-quest-a8139451.html)
    و [دوربین می‌تواند شما را رصد کند](https://www.businessinsider.com/hackers-governments-smartphone-iphone-camera-wikileaks-cybersecurity-hack-privacy-webcam-2017-6)—همه بدون اطلاع یا رضایت شما.
    همچنین اپ‌های مخرب، نبود وصله‌های امنیتی و احتمال درِ پشتی‌ها وجود دارند.

    استفاده از گوشی هوشمند حجم زیادی داده درباره شما تولید می‌کند—از اطلاعاتی که آگاهانه به اشتراک می‌گذارید تا داده‌هایی که
    بی‌صدا از رفتار شما ساخته می‌شوند. دیدن این‌که Google، Microsoft، Apple و Facebook چه می‌دانند ترسناک است—گاهی بیش از
    نزدیک‌ترین خانواده‌تان. درک این‌که داده‌های شما چه چیزهایی را آشکار می‌کند، به‌خصوص در کنار داده‌های دیگر، دشوار است.

    این داده‌ها
    [خیلی فراتر از تبلیغات](https://internethealthreport.org/2018/the-good-the-bad-and-the-ugly-sides-of-data-tracking/)
    استفاده می‌شوند—اغلب برای ارزیابی افراد در امور مالی، بیمه و استخدام. حتی تبلیغات هدفمند می‌توانند برای نظارت دقیق استفاده شوند
    (نگاه کنید به [ADINT](https://adint.cs.washington.edu)).

    نگرانی درباره اینکه
    [دولت‌ها چگونه داده موبایل ما را جمع‌آوری و استفاده می‌کنند](https://www.statista.com/statistics/373916/global-opinion-online-monitoring-government/)
    بیشتر شده و این نگرانی بجاست. نهادهای دولتی اغلب
    [از Google درخواست داده می‌کنند](https://www.statista.com/statistics/273501/global-data-requests-from-google-by-federal-agencies-and-governments/),
    [Facebook](https://www.statista.com/statistics/287845/global-data-requests-from-facebook-by-federal-agencies-and-governments/),
    Apple، Microsoft، Amazon و دیگر شرکت‌های بزرگ. گاهی درخواست‌ها به صورت انبوه است و اطلاعات دقیق همه افراد در یک
    محدوده جغرافیایی را برمی‌گرداند،
    [حتی برای افراد بی‌گناه](https://www.nytimes.com/interactive/2019/04/13/us/google-location-tracking-police.html).
    و این همه ترافیک اینترنتی را که سرویس‌های اطلاعاتی جهان بدون مانع به آن دسترسی دارند شامل نمی‌شود.
  checklist:
  - point: دستگاه خود را رمزنگاری کنید
    priority: Essential
    details: >-
      برای محافظت از داده‌ها در برابر دسترسی فیزیکی، از رمزنگاری فایل استفاده کنید. در این صورت اگر دستگاه گم یا دزدیده شود،
      کسی به داده‌های شما دسترسی نخواهد داشت.

  - point: قابلیت‌های ارتباطی بلااستفاده را خاموش کنید
    priority: Essential
    details: >-
      وقتی از WiFi، Bluetooth، NFC و ... استفاده نمی‌کنید آن‌ها را خاموش کنید. تهدیدهای رایجی از این قابلیت‌ها سوءاستفاده می‌کنند.

  - point: تعداد برنامه‌ها را به حداقل برسانید
    priority: Essential
    details: >-
      برنامه‌هایی که نیاز ندارید یا به‌ندرت استفاده می‌کنید را حذف کنید. بسیاری از اپ‌ها در پس‌زمینه اجرا می‌شوند،
      دستگاه را کند می‌کنند و داده جمع می‌کنند.

  - point: مجوزهای برنامه‌ها
    priority: Essential
    details: >-
      به اپ‌ها مجوزهایی که نیاز ندارند ندهید. برای اندروید، [Bouncer](https://awesome-privacy.xyz/security-tools/mobile-apps/bouncer)
      اجازه می‌دهد مجوزهای موقت/یک‌بارمصرف بدهید.

  - point: فقط از منابع رسمی اپ نصب کنید
    priority: Essential
    details: >-
      برنامه‌های App Store و Google Play اسکن و امضای رمزنگاری می‌شوند و احتمال مخرب بودنشان کمتر است.

  - point: درباره تهدیدهای شارژ گوشی محتاط باشید
    priority: Optional
    details: >-
      Juice Jacking زمانی رخ می‌دهد که مهاجمان از ایستگاه‌های شارژ عمومی برای نصب بدافزار از طریق پورت USB آلوده استفاده می‌کنند.

  - point: پین اپراتور موبایل را فعال کنید
    priority: Essential
    details: >-
      ربایش سیم‌کارت زمانی است که مهاجم شماره شما را به سیم‌کارت خودش منتقل می‌کند. ساده‌ترین راه محافظت، فعال‌سازی پین
      نزد اپراتور موبایل است.

  - point: از فهرست‌های Caller ID خارج شوید
    priority: Optional
    details: >-
      برای خصوصی ماندن اطلاعات، شماره خود را از برنامه‌های Caller ID مثل TrueCaller، CallApp، SyncMe و Hiya حذف کنید.

  - point: از نقشه آفلاین استفاده کنید
    priority: Optional
    details: >-
      از برنامه‌های نقشه آفلاین مثل OsmAnd یا Organic Maps استفاده کنید تا نشت داده از نقشه‌ها کاهش یابد.

  - point: از تبلیغات شخصی‌سازی‌شده انصراف دهید
    priority: Optional
    details: >-
      با انصراف از تبلیغات شخصی‌سازی‌شده می‌توانید کمی از داده جمع‌آوری‌شده بکاهید.

  - point: پاک‌سازی پس از تلاش‌های ناموفق زیاد
    priority: Optional
    details: >-
      برای جلوگیری از جست‌وجوی فراگیر PIN، دستگاه را طوری تنظیم کنید که بعد از تلاش‌های ناموفق زیاد پاک شود.

  - point: ردیاب‌ها را پایش کنید
    priority: Optional
    details: >-
      [εxodus](https://awesome-privacy.xyz/security-tools/online-tools/εxodus) سرویس خوبی است که امکان جست‌وجوی هر اپ
      و دیدن ردیاب‌های آن را می‌دهد.

  - point: از فایروال موبایل استفاده کنید
    priority: Optional
    details: >-
      برای جلوگیری از نشت داده‌های حساس، می‌توانید یک فایروال موبایل نصب کنید.

  - point: فعالیت پس‌زمینه را کاهش دهید
    priority: Optional
    details: >-
      در اندروید، SuperFreeze امکان فریز کامل فعالیت‌های پس‌زمینه به‌صورت برنامه‌به‌برنامه را می‌دهد.

  - point: اپ‌های موبایل را سندباکس کنید
    priority: Optional
    details: >-
      با [Island](https://awesome-privacy.xyz/security-tools/mobile-apps/island) می‌توانید اپ‌های پرمجوز را در محیط سندباکس
      قرار دهید تا به داده‌های خصوصی دسترسی نداشته باشند.

  - point: ترافیک Tor
    priority: Advanced
    details: >-
      [Orbot](https://awesome-privacy.xyz/security-tools/mobile-apps/orbot) اتصال Tor سراسری برای دستگاه فراهم می‌کند
      و از شما در برابر نظارت و تهدیدهای وای‌فای عمومی محافظت می‌کند.

  - point: از کیبوردهای مجازی سفارشی پرهیز کنید
    priority: Optional
    details: >-
      بهتر است از کیبورد پیش‌فرض دستگاه استفاده کنید. اگر کیبورد شخص ثالث نصب می‌کنید، حتما معتبر باشد.

  - point: دستگاه را مرتب ری‌استارت کنید
    priority: Optional
    details: >-
      ری‌استارت کردن گوشی حداقل هفته‌ای یک‌بار، وضعیت کش‌شده برنامه‌ها را پاک می‌کند و ممکن است عملکرد بهتری داشته باشد.

  - point: از SMS پرهیز کنید
    priority: Optional
    details: >-
      برای دریافت کد 2FA یا ارتباط از SMS استفاده نکنید؛ از پیام‌رسان رمزنگاری‌شده مثل
      [Signal](https://awesome-privacy.xyz/communication/encrypted-messaging/signal) بهره بگیرید.

  - point: شماره خود را خصوصی نگه دارید
    priority: Optional
    details: >-
      [MySudo](https://awesome-privacy.xyz/finance/virtual-credit-cards/mysudo) امکان ساخت شماره مجازی برای افراد یا گروه‌های
      مختلف را می‌دهد که برای جداسازی عالی است.

  - point: مراقب استاکروِر باشید
    priority: Optional
    details: >-
      استاکروِر بدافزاری است که توسط فردی آشنا روی دستگاه شما نصب می‌شود. بهترین راه حذف آن، بازگشت به تنظیمات کارخانه است.

  - point: مرورگر را به اپ اختصاصی ترجیح دهید
    priority: Optional
    details: >-
      در صورت امکان به‌جای نصب اپ‌های اختصاصی، از مرورگر امن برای دسترسی به سایت‌ها استفاده کنید.

  - point: استفاده از رام سفارشی را در اندروید در نظر بگیرید
    priority: Advanced
    details: >-
      اگر نگران جمع‌آوری بیش از حد داده توسط سازنده هستید، از رام سفارشی حریم‌خصوصی‌محور استفاده کنید.
  color: fuchsia
